version: 1
solution:
  name: care-clinic
  track: stable
  plugs:
    care_filly:
      enabled: true
      settings:
        backend: {MEDISPEAK_BASE_URL: "https://medispeak.example.org/api/v2"}
    care_onboarding_fe:
      settings:
        frontend: {config.redirect_after_login: false}
    care_multihost_files_be:
      enabled: null
