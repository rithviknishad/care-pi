version: 1
identity:
  display_name: Sunrise Clinic
  hostname: care
solution:
  name: care-clinic
  track: stable
size:
  preset: small-clinic
tls:
  local_ca: {enabled: true}
clock:
  policy: ntp
backups:
  wal_archive_timeout_min: 5
  paused: false
  alert_after_hours: 24
  drill_enabled: true
  schedule: {db_full: "Sun 01:00", db_incr: "daily 02:00", files: "daily 02:30", verify: "Sat 03:00", drill: "*-*-01 04:00"}
  destinations:
    - {id: usb, type: posix, disk_label: care-usb1}
    - id: nas
      type: sftp
      host: nas.lan
      port: 2222
      user: care
      path: /volume1/care
      host_key: ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEXAMPLEEXAMPLEEXAMPLE=
    - {id: b2, type: s3, endpoint: "https://s3.eu-central-003.backblazeb2.com", region: eu-central-003, bucket: sunrise-care, prefix: care-pi, interval_min: 60}
env:
  backend:
    EMAIL_HOST: smtp.example.org
    EMAIL_PORT: "587"
  frontend:
    REACT_APP_TITLE: Sunrise Clinic
fe:
  provider: none
uploads:
  max_body_mb: 200
