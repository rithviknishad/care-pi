# Generated by care-pi from /etc/care-pi/config.yaml. Do not edit.
# The scrape configuration of vmagent (telemetry, Phase 7; docs/telemetry.md).
global:
  scrape_interval: 60s
  external_labels:
    care_pi_version: "dev"
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
    relabel_configs:
      # instance is the host name, not the address of the exporter.
      - target_label: instance
        replacement: "care"
