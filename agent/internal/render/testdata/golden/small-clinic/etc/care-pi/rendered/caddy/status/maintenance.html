<title>CARE: maintenance</title>
</head>
<body>
<main>
<h1>CARE is in maintenance</h1>
<p class="name">Sunrise Clinic</p>
<p>The device updates or restarts CARE. Your data is safe.</p>
<p id="step" aria-live="polite">Wait a few minutes. This page opens CARE again when the maintenance is complete.</p>
<p><small id="since"></small></p>
<p><small>This page checks the device every 5 seconds.</small></p>
</main>
<script>
(function () {
  var steps = {
    "activate": "The device installs the new version.",
    "checkpoint": "The device makes a backup point of the database.",
    "cutover-maintenance-on": "The update starts.",
    "full-cycle": "The device restarts CARE.",
    "maintenance-off": "CARE is ready.",
    "migrate": "The device updates the database. This can take some minutes.",
    "os-upgrade": "The device updates the operating system.",
    "plug-config": "The device sets the plugins.",
    "rollback": "The update did not complete. The device installs the previous version again.",
    "start": "The device starts CARE.",
    "stop": "The device stops CARE.",
    "verify": "The device checks CARE.",
    "write-lock": "The device records the new version.",
  };
  function show(m) {
    var step = document.getElementById("step"), since = document.getElementById("since");
    if (m && m.active) {
      step.textContent = (m.step && steps[m.step]) || "Wait a few minutes. This page opens CARE again when the maintenance is complete.";
      if (m.started_at) {
        var t = new Date(m.started_at);
        since.textContent = "Maintenance since " + t.toLocaleTimeString() + (m.step ? " (step: " + m.step + ")" : "") + ".";
      }
    }
  }
  function poll() {
    fetch("/_care-pi/status", {cache: "no-store", headers: {"Accept": "application/json"}})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) { return; }
        if (s.site === "care") { window.location.reload(); return; }
        show(s.maintenance);
      })
      .catch(function () {})
      .then(function () { setTimeout(poll, 5000); });
  }
  poll();
})();
</script>
</body>
