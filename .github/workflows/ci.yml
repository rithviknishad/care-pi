name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Contract tests through the privileged helper (allow-list check)
        run: CARE_PI_TEST_HELPER=1 go test ./agent/internal/server
      - name: Phase 4 end-to-end test with make-lock.sh (fake host, offline)
        run: solutions/scripts/e2e-local.sh "${RUNNER_TEMP}/e2e-local"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - name: Check for the console
        id: console
        run: |
          if [ -f console/package.json ]; then echo "present=true" >>"$GITHUB_OUTPUT"; else echo "present=false" >>"$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.console.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build the console
        if: steps.console.outputs.present == 'true'
        run: make console-build
      - name: Cross-build for Linux
        run: make build-linux
        env:
          CGO_ENABLED: "0"
      - name: Upload care-pi_linux_arm64
        uses: actions/upload-artifact@v7
        with:
          name: care-pi_linux_arm64
          path: bin/care-pi_linux_arm64
          if-no-files-found: error
      - name: Upload care-pi_linux_amd64
        uses: actions/upload-artifact@v7
        with:
          name: care-pi_linux_amd64
          path: bin/care-pi_linux_amd64
          if-no-files-found: error

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck on installer scripts
        run: find installer -name '*.sh' -type f -print0 | xargs -0 -r shellcheck
      - name: Check the download path of the installer against the release workflow
        run: sh installer/test-download.sh
      - name: Check the firewall tables of the golden cases with nft -c (Phase 7)
        run: |
          sudo apt-get install -y -qq nftables >/dev/null
          for f in agent/internal/render/testdata/golden/*/etc/care-pi/rendered/firewall/care-pi*.nft; do
            sudo nft -c -f "$f"
          done
      - name: Run shellcheck on the solution scripts
        run: find solutions/scripts -name '*.sh' -type f -print0 | xargs -0 -r shellcheck
      - name: Run shellcheck on the image scripts
        run: |
          find image -name '*.sh' -type f -print0 | xargs -0 -r shellcheck
          shellcheck image/stage-care/03-firstboot/files/care-firstboot image/stage-care/03-firstboot/files/care-pi-led
