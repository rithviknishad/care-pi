name: plug-backend

# Test the in-repo backend plug plugs/care_pi_onboarding (S73) against CARE 3.1 (S71):
# - lint: ruff check and ruff format --check;
# - test: the CARE dev image of ohcnetwork/care at care_ref, Postgres 17, and Redis 8; the plug is mounted and
#   on PYTHONPATH (scripts/test-in-docker.sh), the job checks for missing migrations and runs
#   python manage.py test care_pi_onboarding;
# - the install check: install_plugins.py of CARE installs the plug from git with the version
#   @<sha>#subdirectory=plugs/care_pi_onboarding, the form that the solution image uses (docs/onboarding.md).

on:
  push:
    branches: [main]
    paths:
      - plugs/care_pi_onboarding/**
      - .github/workflows/plug-backend.yml
  pull_request:
    paths:
      - plugs/care_pi_onboarding/**
      - .github/workflows/plug-backend.yml
  workflow_dispatch:
    inputs:
      care_ref:
        description: The branch, tag, or sha of ohcnetwork/care
        type: string
        default: ENG-737-backup-backup

permissions:
  contents: read

concurrency:
  group: plug-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARE_REF: ${{ inputs.care_ref || 'ENG-737-backup-backup' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ruff
        working-directory: plugs/care_pi_onboarding
        run: |
          pipx run ruff check .
          pipx run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ohcnetwork/care
          ref: ${{ env.CARE_REF }}
          path: .care
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the CARE dev image
        uses: docker/build-push-action@v7
        with:
          context: .care
          file: .care/docker/dev.Dockerfile
          tags: care-onboarding-test:latest
          load: true
          cache-from: type=gha,scope=care-dev
          cache-to: type=gha,scope=care-dev,mode=max

      - name: Test against CARE
        env:
          CARE_TEST_IMAGE: care-onboarding-test:latest
        run: plugs/care_pi_onboarding/scripts/test-in-docker.sh .care

      - name: Install with install_plugins.py from git
        run: |
          sha="$(git log -1 --format=%H -- plugs/care_pi_onboarding)"
          plugs="$(jq -cn --arg v "@${sha}#subdirectory=plugs/care_pi_onboarding" \
            '[{name: "care_pi_onboarding", package_name: "git+file:///src", version: $v, configs: {}}]')"
          echo "ADDITIONAL_PLUGS=${plugs}"
          docker run --rm -v "${PWD}:/src:ro" -e ADDITIONAL_PLUGS="${plugs}" care-onboarding-test:latest \
            bash -c 'git config --global --add safe.directory "*" && python install_plugins.py \
              && python -c "import care_pi_onboarding, importlib.resources as r; assert (r.files(\"care_pi_onboarding\") / \"fixtures\" / \"locales\" / \"in.json\").is_file()"'
