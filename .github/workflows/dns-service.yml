name: dns-service

# Test and deploy the care-pi DNS/ACME side service (services/dns, docs/dns-service.md).
#
# The deploy job needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   An API token from the "Edit Cloudflare Workers" template, plus "Account > D1 > Edit",
#                          for the account 9df47fe134fdde8490d93c610a9ec93e and the zone rithviknishad.dev.
#   CLOUDFLARE_ACCOUNT_ID  9df47fe134fdde8490d93c610a9ec93e
# If a secret is missing, the deploy job stops with an error. It does not skip silently.
#
# This workflow does not set the Worker secret CF_DNS_API_TOKEN (the DNS edit token of the service).
# Set it one time with "npx wrangler secret put CF_DNS_API_TOKEN" (docs/dns-service.md, section 8).

on:
  push:
    branches: [main]
    paths:
      - services/dns/**
      - .github/workflows/dns-service.yml
  pull_request:
    paths:
      - services/dns/**
      - .github/workflows/dns-service.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns-service-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/dns

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/dns/package-lock.json
      - name: Install
        run: npm ci
      - name: Test (typecheck, workerd tests, Node tests)
        run: npm test
      - name: Check the bundle
        run: npx wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/dns-dist"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the repository secrets
        working-directory: .
        run: |
          missing=""
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then missing="${missing} CLOUDFLARE_API_TOKEN"; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then missing="${missing} CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "${missing}" ]; then
            echo "::error title=dns-service deploy::Missing repository secrets:${missing}. Add them in Settings > Secrets and variables > Actions (docs/dns-service.md, section 8)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/dns/package-lock.json
      - name: Install
        run: npm ci
      - name: Apply the D1 migrations
        run: npx wrangler d1 migrations apply care-pi-dns --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Check the deployed service
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://care-pi.rithviknishad.dev/health; then echo; exit 0; fi
            echo "Attempt ${attempt}: the service does not answer yet."
            sleep 10
          done
          echo "::error title=dns-service deploy::https://care-pi.rithviknishad.dev/health does not answer after the deploy."
          exit 1
