      summary: Replace config.yaml
      description: |
        The agent validates the body against the JSON Schema (`GET /config/schema`) and against the rules of this version.
        Then it writes `config.yaml` and returns a plan preview, as `care-pi apply --dry-run` prints it.
        The agent writes the file again from JSON: comments and the key order of the file are lost.

        - `dry_run=true`: the agent validates and makes the plan. It writes nothing. Status `200`.
        - `apply=true`: after the write, the agent starts an apply job. Status `202`, with the job in `job`.
        - Else: the agent writes the file. Status `200`. Run `POST /apply` later.

        `If-Match` is required. A different ETag gives `412` with `config-changed`.
        Before the setup state is `ready`, `apply=true` gives `409` with `setup-incomplete`.
      security:
        - session: []
          csrf: []
      x-cli: care-pi config validate && care-pi apply --dry-run
      x-problems: [not-authenticated, csrf, invalid-request, invalid-config, unsupported-config, config-changed, precondition-required, job-running, setup-incomplete]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/ApplyAfterWrite'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          $ref: '#/components/responses/ConfigChanged'
        '202':
          $ref: '#/components/responses/ConfigChangedWithJob'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    patch:
      tags: [config]
      operationId: patchConfig
      summary: Change some keys of config.yaml
      description: |
        A JSON merge patch (RFC 7396) on the keys of the file (`view=file`), not on the effective config.
        `null` deletes a key, so the key gets its default again.
        The other rules are the same as `PUT /config`.
      security:
        - session: []
          csrf: []
      x-cli: care-pi config set KEY=VALUE... [--dry-run] [--apply]
      x-problems: [not-authenticated, csrf, invalid-request, invalid-config, unsupported-config, config-changed, precondition-required, job-running, setup-incomplete]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/ApplyAfterWrite'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ConfigPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          $ref: '#/components/responses/ConfigChanged'
        '202':
          $ref: '#/components/responses/ConfigChangedWithJob'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
