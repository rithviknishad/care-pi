  /setup/steps/backups:
    put:
      tags: [setup]
      operationId: setBackups
      summary: Set the backup destinations and confirm the recovery key
      description: |
        At least 1 destination is necessary (S18). Make the recovery key first (`POST /backups/recovery-key`).
        The agent does these things in this order. It stops at the first error and writes nothing:

        1. It validates `destinations` against `backups.destinations` of the config schema (`invalid-config`).
        2. Each `sftp` destination must have `host_key`. Else `422` with `destination-untrusted-hostkey`.
           Get the key from `POST /backups/destinations/test` (TOFU).
        3. It stores `credentials` as `PUT /backups/destinations/{destination_id}/secrets` does.
           An `s3` destination without credentials in the body or on disk gives `invalid-request` (code `missing-credentials`).
        4. It tests each destination as `POST /backups/destinations/test` does, without a bucket creation.
           A failed test gives `422` with `destination-unreachable` and `destination_id`. The agent does not test again
           a destination that passed a test with the same values in the last 15 minutes.
        5. It checks `recovery_key_words` against the confirm positions of the recovery key (`recovery-key-mismatch`).
           `null` is possible when the key is already confirmed (`POST /backups/recovery-key/confirm`).
        6. It writes `backups.destinations` into `config.yaml`. Nothing is applied before the finish.

        The step is `done` when `config.yaml` has 1 or more destinations and the recovery key is `confirmed`.
        Only a dev build can skip the step (`POST /setup/steps/backups/skip`).
        The finish job then makes the restic repositories, turns on the timers, and makes the first full backup.
      security:
        - session: []
          csrf: []
      x-cli: care-pi config set backups.destinations=JSON && care-pi backup recovery-key confirm
      x-problems: [not-authenticated, csrf, invalid-request, invalid-config, setup-finished, job-running, no-recovery-key, recovery-key-mismatch, destination-unreachable, destination-untrusted-hostkey]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupsStep'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          $ref: '#/components/responses/SetupStateResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BackupsConflict'
        '422':
          $ref: '#/components/responses/BackupsUnprocessable'
