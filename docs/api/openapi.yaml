    get:
      tags: [tls]
      operationId: getRootCa
      summary: Download the root CA certificate
      description: |
        The certificate of the local CA (public data). It needs no session: each staff device must install it
        before the staff can use Care without a warning (07 §6). The response has the SHA-256 fingerprint in a header.
        Both ports serve it. The setup page on port 443 links to `/_care-pi/tls/root-ca`, so a device can install
        the root CA before it opens the console on port 8443.
        When the local CA mode is off or the CA does not exist yet, the agent returns `404`.
