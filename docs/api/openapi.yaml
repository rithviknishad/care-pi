openapi: 3.1.0
info:
  title: care-pi agent API
  version: 0.3.0
  summary: The HTTP API between the care-pi agent and the console.
  description: |
    This document is the contract between the care-pi agent (`care-pi serve`) and the console.
    The design note `docs/api/README.md` explains the auth flow, the setup state machine,
    the SSE format, and the policies. Read it first.

    Rules for the whole document:

    - The console has its own origin (S48): `https://<host>:8443/`. The SPA is at `/` and the API is at `/api/v1/`.
      Care stays on `https://<host>/` (port 443). On port 443, `/console` and `/console/*` return
      `308` to `https://<host>:8443/`.
    - The agent listens on the unix socket `/run/care-pi/api.sock`. Caddy is the only client.
      On port 8443, Caddy sends each request to the socket. On port 443, Caddy sends only `/_care-pi/*` to the socket.
    - The public operations are on both ports, below `/_care-pi/`: `GET /_care-pi/status`, `GET /_care-pi/health`,
      and the three public `/_care-pi/tls/...` operations. On port 8443 they are also below `/api/v1/`.
      Each of these operations lists its servers.
    - The agent sends no CORS headers (`Access-Control-*`) on any response.
    - Each request body and each response body is JSON (`application/json`), except where an
      operation tells otherwise.
    - Each error response is `application/problem+json` (RFC 9457). The schema is `Problem`.
      The member `type` identifies the problem. A client must check `type`, not only the status code.
    - Each operation lists the problem types that it can return in `x-problems`.
      Each operation can also return `malformed-request`, `unsupported-media-type`,
      `payload-too-large`, `rate-limited`, `internal`, and `unavailable`.
    - `x-cli` gives the CLI command with the same effect (CLI parity). `-` means that no CLI command is
      necessary: the operation only manages browser state. Root on the host needs no session.
    - `x-phase: N` marks an operation or a member that Phase N implements. Without `x-phase`, Phase 2
      implements it. In Phase 2, an operation with `x-phase` greater than 2 returns `501`
      with the problem type `not-implemented-in-this-version`. A member with `x-phase` greater than 2 is `null`.
    - `x-reauth: true` marks an operation that needs a recent authentication (5 minutes).
      Else the operation returns `403` with `reauth-required`.
    - Each response has `Cache-Control: no-store`, except the two root CA downloads.
    - The agent rejects a request body that is larger than 1 MiB (`payload-too-large`).
    - Times are RFC 3339 in UTC, for example `2026-10-30T10:15:00Z`. Sizes are in bytes.
  contact:
    name: care-pi
    url: https://github.com/rithviknishad/care-pi
servers:
  - url: /api/v1
    description: >-
      The console origin on port 8443, for example https://care.local:8443/api/v1.
      Caddy sends the requests to the agent on a unix socket. The socket is an implementation detail.
tags:
  - name: system
    description: Public status, agent health, and host checks.
  - name: session
    description: Claim of a new device, login, logout, recovery-code login, and the current session.
  - name: security
    description: The console password, the recovery codes, TOTP, the sessions, and SSH.
  - name: setup
    description: |
      The setup wizard: a state machine with steps (see the design note).
      Before the state `ready`, each step accepts a `PUT` in any order.
      While the state is `applying`, a step change gives `409` with `job-running`.
      After the state `ready`, a step change gives `409` with `setup-finished`. Use `/config` then.
  - name: status
    description: The full status for the dashboard, in one call.
  - name: config
    description: The desired state, `/etc/care-pi/config.yaml`, as JSON. The JSON Schema, and the presets.
  - name: apply
    description: Apply the config to the host. The result is a job.
  - name: jobs
    description: Long operations. Each job has steps and an event stream (SSE).
  - name: logs
    description: The journal of each unit, as a page or as a live stream (SSE).
  - name: support
    description: The support bundle. Logs, states, and config without secrets, in one file.
  - name: network
    description: Host names, LAN addresses, the mDNS name that avahi announces, and Wi-Fi.
  - name: tls
    description: TLS modes, the root CA download, and the install steps for each OS.
  - name: fe
    description: The care_fe build.
  - name: care
    description: The first Care superuser and the hand-off to Care.
  - name: power
    description: Reboot and shut down the host.
  - name: backups
    description: Backups (Phase 3). The URLs and the shapes are reserved now.
  - name: restore
    description: Restore (Phase 3). The URLs and the shapes are reserved now.
  - name: updates
    description: Solution updates (Phase 4). The URLs and the shapes are reserved now.
  - name: plugs
    description: Plugs (Phase 4). The URLs and the shapes are reserved now.
security:
  - session: []
paths:
  /_care-pi/status:
    servers:
      - url: 'https://{host}:{port}'
        description: The root of each origin. Port 443 (Care) and port 8443 (console) serve this path.
        variables:
          host:
            default: care.local
            description: A host name or a LAN address that Caddy serves.
          port:
            enum: ['443', '8443']
            default: '443'
            description: '`443`: the Care origin. `8443`: the console origin.'
    get:
      tags: [system]
      operationId: getPublicStatus
      summary: Get the public status
      description: |
        The status pages of Caddy and the installer use this operation. It needs no session.
        It gives only the data that the status pages show: the page that Caddy serves now, the setup state,
        the claim methods, the clock gate, and the progress of a job that changes the host.
        It gives no address, no version, and no unit detail.
        The agent keeps the result for 2 s.
      security: []
      x-cli: care-pi status --json
      x-problems: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The public status.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    servers:
      - url: /api/v1
        description: The console origin (port 8443), below /api/v1.
      - url: 'https://{host}:{port}/_care-pi'
        description: Each origin (port 443 and port 8443), below /_care-pi. The status pages and the flow on port 443 use this form.
        variables:
          host:
            default: care.local
            description: A host name or a LAN address that Caddy serves.
          port:
            enum: ['443', '8443']
            default: '443'
            description: '`443`: the Care origin. `8443`: the console origin.'
    get:
      tags: [system]
      operationId: getHealth
      summary: Get the health of the agent
      description: |
        The agent answers `200` when it can serve requests. It needs no session.
        On port 443 the path is `/_care-pi/health`, because Care has the routes `/health/*` on that origin.
        A client can use this operation to test the trust of a root CA on another host name:
        `fetch("https://<ip>:8443/api/v1/health", {mode: "no-cors"})` completes only when the browser trusts the certificate.
      security: []
      x-cli: systemctl is-active care-pi.service
      x-problems: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The agent can serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /host/check:
    get:
      tags: [system]
      operationId: getHostCheck
      summary: Check the host and the hardware
      description: |
        The checks of `care-pi host check`, and the hardware facts that the setup wizard shows.
        The agent only reads. It never changes the host.
        With `probe=true`, the agent also measures the root disk for about 10 s.
        The agent keeps the result of the disk probe for 24 h.
      x-cli: care-pi host check --json [--probe]
      x-problems: [not-authenticated]
      parameters:
        - name: probe
          in: query
          description: Measure the write and read speed of the root disk (about 10 s).
          schema:
            type: boolean
            default: false
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The host check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCheck'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Get the current session
      description: |
        The console calls this operation at start. The response has the CSRF token.
        Without a valid session cookie, the agent returns `401` with `not-authenticated`.
        Then the console reads `GET /_care-pi/status` to choose the claim page or the login page.
      x-cli: '-'
      x-problems: [not-authenticated]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
    delete:
      tags: [session]
      operationId: logout
      summary: Log out
      description: The agent deletes the session and clears the session cookie.
      security:
        - session: []
          csrf: []
      x-cli: '-'
      x-problems: [not-authenticated, csrf]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '204':
          description: The session is deleted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /session/claim:
    post:
      tags: [session]
      operationId: claimDevice
      summary: Claim the device and set the console password
      description: |
        The first operation on a new device. It needs no session.
        The operator proves ownership with a claim secret: the password of the user that Raspberry Pi Imager
        created (`os-password`), or the claim code that the installer printed (`claim-code`).
        `GET /_care-pi/status` lists the methods that the device accepts.

        In one step the agent:
        1. checks the claim secret,
        2. sets the console password (argon2id),
        3. makes 8 recovery codes,
        4. deletes the claim code,
        5. creates a session and sets the session cookie.

        The response has the recovery codes. The agent shows them only one time.
        After the claim, the agent returns `409` with `already-claimed`.
        A `method` that the device does not accept gives `422` with `invalid-request` (pointer `/method`).
        An incorrect secret gives `401` with `bad-credentials`.
        Five failed claims (from all addresses together) lock the claim for 15 minutes.
      security: []
      x-cli: care-pi auth set-password --password-stdin
      x-problems: [bad-credentials, csrf, already-claimed, invalid-request, weak-password, locked-out]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '201':
          description: The device is claimed. The session cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /session/login:
    post:
      tags: [session]
      operationId: login
      summary: Log in with the console password
      description: |
        It needs no session. A successful login always creates a new session, with a new id and a new CSRF token.
        When TOTP is on and `totp_code` is not in the body, the agent returns `401` with `totp-required`.
        Then the console asks for the code and sends the password and the code again.
      security: []
      x-cli: '-'
      x-problems: [bad-credentials, totp-required, csrf, not-claimed, invalid-request, locked-out]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The session is created. The session cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /session/recover:
    post:
      tags: [session]
      operationId: recover
      summary: Log in with a recovery code and set a new password
      description: |
        Use this operation when the operator forgets the password or loses the TOTP device.
        It needs no session. The agent uses the recovery code (one time only), sets the new password,
        turns TOTP off, deletes all other sessions, and creates a new session.
        `sudo care-pi auth reset` on the host is the last fallback (S46).
      security: []
      x-cli: care-pi auth reset --password-stdin
      x-problems: [bad-credentials, csrf, not-claimed, invalid-request, weak-password, locked-out]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The password is new. The session cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /session/reauth:
    post:
      tags: [session]
      operationId: reauthenticate
      summary: Enter the password again
      description: |
        The agent checks the password and sets `authenticated_at` of the session to now.
        Then each operation with `x-reauth: true` is possible for 5 minutes.
        A failure counts for the lockout rules.
      security:
        - session: []
          csrf: []
      x-cli: '-'
      x-problems: [not-authenticated, bad-credentials, csrf, invalid-request, locked-out]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The session is recently authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /security:
    get:
      tags: [security]
      operationId: getSecurity
      summary: Get the security settings
      description: The password age, the number of recovery codes that remain, TOTP, the lockout state, and the claim record.
      x-cli: care-pi auth status --json
      x-problems: [not-authenticated]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The security settings. No secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityState'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
  /security/password:
    put:
      tags: [security]
      operationId: changePassword
      summary: Change the console password
      description: |
        The body has the current password, so no reauthentication is necessary.
        The agent deletes all other sessions. It gives the current session a new id and sets the cookie again.
      security:
        - session: []
          csrf: []
      x-cli: care-pi auth set-password --password-stdin
      x-problems: [not-authenticated, bad-credentials, csrf, invalid-request, weak-password, locked-out]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The password is changed.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /security/recovery-codes:
    post:
      tags: [security]
      operationId: regenerateRecoveryCodes
      summary: Make 8 new recovery codes
      description: |
        The agent makes 8 new recovery codes and deletes the old codes.
        The response is the only time that the agent shows the codes.
        During setup, the console uses this operation when the operator did not save the codes of the claim.
      security:
        - session: []
          csrf: []
      x-reauth: true
      x-cli: care-pi auth recovery-codes --regenerate
      x-problems: [not-authenticated, csrf, reauth-required]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The new recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /security/totp:
    post:
      tags: [security]
      operationId: startTotpEnrolment
      summary: Start the TOTP enrolment
      description: |
        The agent makes a TOTP secret (RFC 6238: SHA-1, 6 digits, 30 s) and keeps it for 10 minutes.
        The response is the only time that the agent shows the secret.
        TOTP is on only after `POST /security/totp/verify` with a correct code.
      security:
        - session: []
          csrf: []
      x-reauth: true
      x-cli: care-pi auth totp enrol
      x-problems: [not-authenticated, csrf, reauth-required, state-conflict]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The secret for the authenticator app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [security]
      operationId: disableTotp
      summary: Turn TOTP off
      security:
        - session: []
          csrf: []
      x-reauth: true
      x-cli: care-pi auth totp disable
      x-problems: [not-authenticated, csrf, reauth-required, state-conflict]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '204':
          description: TOTP is off.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /security/totp/verify:
    post:
      tags: [security]
      operationId: verifyTotp
      summary: Verify the first TOTP code and turn TOTP on
      description: |
        The agent accepts the code of the current 30 s step and of the step before and after it.
        An incorrect code gives `422` with `invalid-request` and counts for the lockout rules.
      security:
        - session: []
          csrf: []
      x-cli: care-pi auth totp enrol
      x-problems: [not-authenticated, csrf, invalid-request, state-conflict, locked-out]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: TOTP is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityState'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /security/sessions:
    get:
      tags: [security]
      operationId: listSessions
      summary: List the sessions
      x-cli: care-pi auth sessions --json
      x-problems: [not-authenticated]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The sessions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
  /security/sessions/{session_ref}:
    delete:
      tags: [security]
      operationId: revokeSession
      summary: Delete a session
      description: To delete the current session, use `DELETE /session`.
      security:
        - session: []
          csrf: []
      x-cli: care-pi auth sessions revoke REF
      x-problems: [not-authenticated, csrf, not-found]
      parameters:
        - $ref: '#/components/parameters/SessionRef'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '204':
          description: The session is deleted.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /security/ssh:
    put:
      tags: [security]
      operationId: setSsh
      summary: Turn SSH on or off
      description: |
        Phase 7. When SSH is on, the agent allows only keys (no password) and opens 22/tcp in the firewall.
      security:
        - session: []
          csrf: []
      x-phase: 7
      x-reauth: true
      x-cli: care-pi ssh enable|disable
      x-problems: [not-authenticated, csrf, reauth-required, invalid-request, not-implemented-in-this-version]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshSettings'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The SSH settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshSettings'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /setup:
    get:
      tags: [setup]
      operationId: getSetup
      summary: Get the setup state, the steps, and the draft
      description: |
        The console calls this operation after each start and after each step.
        `current_step` is the first step in list order that is not `done` and not `skipped`.
        When the state is `applying`, `job_id` is the finish job. Follow it with `GET /jobs/{job_id}/events`.
        When a finish job failed, the state is `setup` again and `job_id` is the failed job.
      x-cli: care-pi setup status --json
      x-problems: [not-authenticated]
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The setup state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
  /setup/steps/recovery-codes:
    put:
      tags: [setup]
      operationId: confirmRecoveryCodes
      summary: Confirm that the operator saved the recovery codes
      description: |
        The body has one of the recovery codes. The agent checks it against the codes that are not used.
        The agent does not use the code. An incorrect code gives `422` with `invalid-request`.
