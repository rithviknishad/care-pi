    get:
      tags: [logs]
      operationId: getLogs
      summary: Read or follow the journal of a unit
      description: |
        The agent runs `journalctl` for the unit.

        - `application/json`: the last `n` lines (or the lines after the cursor `after`), oldest first.
        - `text/event-stream` with `follow=true`: the last `n` lines, then each new line. The event id is the journal cursor.
          After a reconnect with `Last-Event-ID`, the stream continues after that cursor. A `heartbeat` event comes every 15 s.
