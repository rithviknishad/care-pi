      examples:
        - model: Raspberry Pi 5 Model B Rev 1.0
          arch: arm64
          kernel: 6.18.0-v8-16k+
          os: Debian GNU/Linux 13 (trixie)
          page_size_bytes: 16384
          cpu_count: 4
