      description: |
        Everything that the dashboard shows, in one call. The shape is append-only: a later version only adds members.
        The members of `care-pi status --json` of Phase 1 keep their names and types.
        The agent keeps the result for 2 s. The console polls every 5 s at most.
      x-cli: care-pi status --json
