    post:
      tags: [setup]
      operationId: finishSetup
      summary: Finish setup and start Care
      description: |
        Each required step must be `done` (or `skipped` where allowed). Else the agent returns `409` with
        `setup-incomplete` and the list `missing_steps`.
        The agent starts a job of kind `setup` and the state becomes `applying`.
        The job validates the config and checks the host.
        Then it runs a full apply: lock, images, units, buckets, stanza, and FE build.
        Then it waits until Care is healthy and creates the Care superuser.
        A cold first FE build takes about 3 minutes on a Pi 5, plus the image pulls.
        Success: the state becomes `ready`. Failure: the state becomes `setup` again and `job_id` is the failed job.
      security:
        - session: []
          csrf: []
      x-cli: care-pi setup finish
      x-problems: [not-authenticated, csrf, setup-incomplete, setup-finished, job-running, invalid-config, unsupported-config, host-check-failed]
