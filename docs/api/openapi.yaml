    post:
      tags: [apply]
      operationId: startApply
      summary: Apply config.yaml
      description: |
        The agent validates `config.yaml` first (`422` on an error). Then it starts a job of kind `apply`.
        Only one job that changes the host runs at a time (the apply lock, `/run/care-pi/apply.lock`).
        When the lock is not free, the agent returns `409` with `job-running` and the id of that job.
        The CLI holds the same lock. Before the setup state is `ready`, the agent returns `409` with `setup-incomplete`.
        A run without a change completes with `result.changed: false`.
      security:
        - session: []
          csrf: []
      x-cli: care-pi apply [--update] [--reason TEXT]
      x-problems: [not-authenticated, csrf, invalid-request, invalid-config, unsupported-config, job-running, setup-incomplete]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        default:
