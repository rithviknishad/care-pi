        last_wal_archived_at:
          type: [string, 'null']
          format: date-time
          description: The time of the last archived WAL segment.
        window_from:
          type: [string, 'null']
          format: date-time
          description: The earliest point in time for a PITR (the end of the oldest full backup).
        window_to:
          type: [string, 'null']
          format: date-time
          description: The latest point in time for a PITR (the last archived WAL segment). A restore job archives the current segment first.
        size_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The size of the repository on disk.
        state:
          type: string
          enum: [none, ok, degraded, error, unknown]
          description: |
            `none`: no backup yet (before the finish of setup). `ok`: the last backup and the WAL archive succeeded.
            `degraded`: the last scheduled backup failed, but the WAL archive works. `error`: the WAL archive fails.
            `unknown`: the agent cannot read the repository. A later version can add states.
        repo_path:
          type: string
          description: The directory of the repository on the host.
          examples: [/var/lib/care-pi/backup/pg]
        key:
          type: string
          enum: [derived, legacy, none]
          description: |
            The source of the cipher pass. `derived`: from the recovery key. `legacy`: a random pass of Phase 1 or Phase 2
            (re-key it with `POST /backups/recovery-key/rotate`, `new_key: false`; design note section 13.12). `none`: no repository yet.
        timeline:
          type: [integer, 'null']
          minimum: 1
          description: The Postgres timeline now. A PITR makes a new timeline.
        backup_count:
          type: integer
          minimum: 0
          description: The backups in the repository.
        last_backup:
          description: The newest backup. `null` without a backup.
          oneOf:
            - $ref: '#/components/schemas/LocalBackup'
            - type: 'null'
        last_error:
          type: [string, 'null']
          description: The error of the last failed backup or WAL archive. `null` after a success.
        wal_archive_failing_since:
          type: [string, 'null']
          format: date-time
          description: The first failed `archive-push` after the last success. `null` when the WAL archive works.
        free_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The free space of the file system of the repository.
        next_full_at:
          type: [string, 'null']
          format: date-time
          description: The next run of the full backup timer. `null` when the timers are off.
        next_incr_at:
          type: [string, 'null']
          format: date-time
          description: The next run of the incremental backup timer. `null` when the timers are off.
        last_verify:
          description: The last `pgbackrest verify`. `null` before the first verify.
          oneOf:
            - $ref: '#/components/schemas/VerifyOutcome'
            - type: 'null'
      examples:
        - last_full_at: '2026-10-26T01:00:00Z'
          last_incr_at: '2026-10-30T02:00:00Z'
          last_wal_archived_at: '2026-10-30T10:55:00Z'
          window_from: '2026-10-19T01:00:00Z'
          window_to: '2026-10-30T10:55:00Z'
          size_bytes: 48234496
          state: ok
          repo_path: /var/lib/care-pi/backup/pg
          key: derived
          timeline: 1
          backup_count: 9
          last_backup: null
          last_error: null
          wal_archive_failing_since: null
          free_bytes: 221000000000
          next_full_at: '2026-11-01T01:00:00Z'
          next_incr_at: '2026-10-31T02:00:00Z'
          last_verify: null
    DestinationState:
      type: object
      additionalProperties: false
      description: The state of one restic destination. The agent reads it from its state files; it does not connect to the destination.
      required: [id, type, state, last_snapshot_at, size_bytes, free_bytes, last_error, location, destination, credentials, host_key_fingerprint, last_db_snapshot_at, last_files_snapshot_at, last_attempt_at, last_error_code, failing_since, next_db_run_at, next_files_run_at, rpo_minutes, snapshot_count, last_verify, running, recent_runs]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination id.
          examples: [usb]
        type:
          type: string
          enum: [posix, sftp, s3]
          description: The destination type.
        state:
          type: string
          enum: [pending, ok, degraded, error, unknown]
          description: |
            `pending`: no run yet (a new destination). `ok`: the last run succeeded.
            `degraded`: the last run failed, but a snapshot younger than `backups.alert_after_hours` exists.
            `error`: no successful snapshot for `backups.alert_after_hours`, the host key changed, or the secret is not there.
            `unknown`: the agent cannot read the state. A later version can add states.
        last_snapshot_at:
          type: [string, 'null']
          format: date-time
          description: The last successful snapshot of each kind.
        size_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The size of the restic repository (after the last snapshot).
        free_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The free space at the destination, when it is known (`posix`, some `sftp` servers).
        last_error:
          type: [string, 'null']
          description: The error of the last failed run. `null` after a success.
        location:
          type: string
          description: The restic repository, without secrets.
          examples: ['sftp:care@nas.lan:/volume1/care/care-pi-1a2b3c4d']
        destination:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination'
          description: The destination of `config.yaml`, with the defaults of `interval_min` and `retention`.
        credentials:
          type: string
          enum: [not-needed, present, missing]
          description: The secret of an `s3` destination. `not-needed` for `posix` and `sftp`.
        host_key_fingerprint:
          type: [string, 'null']
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: The SHA-256 fingerprint of the pinned host key (`sftp`). `null` for the other types or without `host_key`.
        last_db_snapshot_at:
          type: [string, 'null']
          format: date-time
          description: The last successful `db` snapshot (the local repository and `/etc/care-pi`).
        last_files_snapshot_at:
          type: [string, 'null']
          format: date-time
          description: The last successful `files` snapshot (`/var/lib/care-pi/s3` and `/etc/care-pi`).
        last_attempt_at:
          type: [string, 'null']
          format: date-time
          description: The start of the last run.
        last_error_code:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: A problem slug (`destination-unreachable`, `destination-untrusted-hostkey`, `insufficient-space`) or a check name of the destination test.
          examples: [destination-unreachable]
        failing_since:
          type: [string, 'null']
          format: date-time
          description: The first failed run after the last success. `null` when the last run succeeded.
        next_db_run_at:
          type: [string, 'null']
          format: date-time
          description: The next `db` snapshot. `null` when the timers are off.
        next_files_run_at:
          type: [string, 'null']
          format: date-time
          description: The next `files` snapshot. `null` when the timers are off.
        rpo_minutes:
          type: integer
          minimum: 1
          description: '`interval_min` + `backups.wal_archive_timeout_min`.'
          examples: [20]
        snapshot_count:
          type: [integer, 'null']
          minimum: 0
          description: The snapshots in the repository after the last run.
        last_verify:
          description: The last `restic check` of this destination. `null` before the first verify.
          oneOf:
            - $ref: '#/components/schemas/VerifyOutcome'
            - type: 'null'
        running:
          type: boolean
          description: A snapshot, forget, prune, or check of this destination runs now.
        recent_runs:
          type: array
          maxItems: 10
          description: The last 10 runs, newest first. A timer run of every 15 minutes has no job, so this list is its history.
          items:
            $ref: '#/components/schemas/DestinationRun'
      examples:
        - id: b2
          type: s3
          state: degraded
          last_snapshot_at: '2026-10-30T10:30:00Z'
          size_bytes: 61234567
          free_bytes: null
          last_error: 'dial tcp: lookup s3.eu-central-003.backblazeb2.com: no such host'
          location: s3:https://s3.eu-central-003.backblazeb2.com/sunrise-care/care-pi/care-pi-1a2b3c4d
          destination: {id: b2, type: s3, endpoint: 'https://s3.eu-central-003.backblazeb2.com', region: eu-central-003, bucket: sunrise-care, prefix: care-pi, interval_min: 15, retention: {keep_within_days: 14, keep_daily: 14, keep_weekly: 8, keep_monthly: 6}}
          credentials: present
          host_key_fingerprint: null
          last_db_snapshot_at: '2026-10-30T10:30:00Z'
          last_files_snapshot_at: '2026-10-30T02:30:00Z'
          last_attempt_at: '2026-10-30T10:45:00Z'
          last_error_code: destination-unreachable
          failing_since: '2026-10-30T10:45:00Z'
          next_db_run_at: '2026-10-30T11:00:00Z'
          next_files_run_at: '2026-10-31T02:30:00Z'
          rpo_minutes: 20
          snapshot_count: 388
          last_verify: null
          running: false
          recent_runs:
            - {started_at: '2026-10-30T10:45:00Z', finished_at: '2026-10-30T10:45:31Z', kind: db, source: timer, ok: false, snapshot_id: null, added_bytes: null, error_code: destination-unreachable, error: 'dial tcp: lookup s3.eu-central-003.backblazeb2.com: no such host', job_id: null}
    BackupRunRequest:
      type: object
      additionalProperties: false
      description: 'The options of "Back up now". An empty body is `scope: all`, `type: incr`.'
      properties:
        destination:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: 'The destination for `scope: destination`. `null` for the other scopes.'
          examples: [usb]
        scope:
          type: string
          enum: [all, local-db, destination]
          description: |
            `all`: the local backup, then the snapshots to each destination. `local-db`: only the local backup (the checkpoint
            with `type: incr`). `destination`: only the snapshots to `destination`.
            Default: `destination` when `destination` is set, else `all`.
        type:
          type: string
          enum: [incr, full]
          default: incr
          description: The type of the local backup (`all` and `local-db`).
        reason:
          type: [string, 'null']
          maxLength: 200
          description: A text for the job journal. The local backup keeps it as the pgBackRest annotation `care-pi-reason`.
          examples: [before the import of the lab results]
      examples:
        - destination: null
        - scope: local-db
          type: incr
          destination: null
          reason: before the update to 2026.11.1
    DestinationTestRequest:
      type: object
      additionalProperties: false
      description: A candidate destination to test, with its secret, and the answers of the operator (host key, bucket).
      required: [destination, credentials]
      properties:
        destination:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination'
        credentials:
          oneOf:
            - $ref: '#/components/schemas/DestinationCredentials'
            - type: 'null'
          description: The secret of an `s3` destination. `null` uses the stored secret of `destination.id`, and is the value for the other types.
        accept_fingerprint:
          type: [string, 'null']
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: '`sftp`: the fingerprint that the operator accepted in the first call (TOFU). The agent continues only when the server presents this key.'
          examples: ['SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s']
        create_bucket:
          type: boolean
          default: false
          description: '`s3`: create the bucket when it does not exist (`LocationConstraint` from `region`). Nothing else creates it (SP6).'
      examples:
        - destination: {id: b2, type: s3, endpoint: 'https://s3.eu-central-003.backblazeb2.com', bucket: sunrise-care, region: eu-central-003}
          credentials: {access_key_id: AKIAEXAMPLE, secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
          accept_fingerprint: null
          create_bucket: true
    DestinationTestResult:
      type: object
      additionalProperties: false
      description: The result of each check of a candidate destination, and what the console asks next.
      required: [ok, checks, host_key_fingerprint, public_key, host_key, next_action, repository, free_bytes, location, tested_at]
      properties:
        ok:
          type: boolean
          description: Each check with the level `required` passed.
        checks:
          type: array
          description: The checks in order. The agent stops at the first failed required check.
          items:
            $ref: '#/components/schemas/HostCheckItem'
        host_key_fingerprint:
          type: [string, 'null']
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: '`sftp`: the SHA-256 fingerprint of the key that the server presents. The same value as `host_key.fingerprint_sha256`.'
          examples: ['SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s']
        public_key:
          type: [string, 'null']
          description: '`sftp`: the SSH public key of the agent, when the server refused it. Add it to `~/.ssh/authorized_keys` on the server.'
          examples: [ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE care-pi@care-1a2b3c4d]
        host_key:
          description: '`sftp`: the key that the server presents. `null` for the other types.'
          oneOf:
            - $ref: '#/components/schemas/HostKey'
            - type: 'null'
        next_action:
          type: string
          enum: [none, accept-host-key, install-ssh-key, create-bucket, fix]
          description: |
            What the console asks next. `none`: each check passed. `accept-host-key`: show the fingerprint, then send `accept_fingerprint`.
            `install-ssh-key`: show `public_key`. `create-bucket`: ask, then send `create_bucket: true`.
            `fix`: show the failed check and its `fix`. A later version can add values.
        repository:
          type: [object, 'null']
          additionalProperties: false
          description: The care-pi repositories at the location. `null` when the agent could not list the location.
          required: [exists, other_key_ids]
          properties:
            exists:
              type: boolean
              description: '`care-pi-<key id>` of this recovery key exists. The agent then uses it again.'
            other_key_ids:
              type: array
              description: The key ids of other care-pi repositories at the location (another device, or an older key).
              items:
                type: string
                pattern: '^[0-9a-f]{8}$'
        free_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The free space at the destination, when it is known.
        location:
          type: [string, 'null']
          description: The restic repository of this destination for the recovery key now. `null` without a recovery key.
          examples: [/var/lib/care-pi/disks/care-usb1/care-pi-1a2b3c4d]
        tested_at:
          type: string
          format: date-time
          description: The time of the test.
      examples:
        - ok: true
          checks:
            - {name: mount, level: required, ok: true, detail: LABEL=care-usb1 at /var/lib/care-pi/disks/care-usb1}
            - {name: write, level: required, ok: true, detail: wrote and read 1 MiB}
            - {name: root-disk, level: advised, ok: true, detail: the path is not on the root disk}
          host_key_fingerprint: null
          public_key: null
          host_key: null
          next_action: none
          repository: {exists: false, other_key_ids: []}
          free_bytes: 120000000000
          location: /var/lib/care-pi/disks/care-usb1/care-pi-1a2b3c4d
          tested_at: '2026-10-30T10:07:00Z'
    RecoveryKey:
      type: object
      additionalProperties: false
      description: |
        The recovery key (`02` §2, design note section 13.3): 24 words of the BIP-39 English list (256 bits and an 8-bit checksum).
        Only `GET /backups/recovery-key` (with a recent authentication) and `POST /backups/recovery-key` give it.
      required: [words, created_at, key, key_id, qr_payload, file_name]
      properties:
        words:
          type: array
          minItems: 24
          maxItems: 24
          description: The words in order.
          items:
            type: string
            pattern: '^[a-z]{3,8}$'
        created_at:
          type: string
          format: date-time
          description: The creation of the key.
        key:
          type: string
          enum: [active, pending]
          description: '`active`: the key in use. `pending`: the new key of a rotation.'
        key_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: The key id (HKDF). It names the restic repositories (`care-pi-<key id>`) and is on the printed sheet. It is not secret.
          examples: [1a2b3c4d]
        qr_payload:
          type: string
          pattern: '^CARE-PI-RK1:[A-Z]{3,8}( [A-Z]{3,8}){23}$'
          description: The text of the QR code. The QR alphanumeric mode keeps it small. The restore wizard reads it with the camera.
        file_name:
          type: string
          pattern: '^care-recovery-[a-z0-9-]{1,64}\.txt$'
          description: The file name of `GET /backups/recovery-key/download`.
          examples: [care-recovery-sunrise-clinic.txt]
      examples:
        - words: [abandon, ability, able, about, above, absent, absorb, abstract, absurd, abuse, access, accident, account, accuse, achieve, acid, acoustic, acquire, across, act, action, actor, actress, actual]
          created_at: '2026-10-30T10:06:00Z'
          key: active
          key_id: 1a2b3c4d
          qr_payload: CARE-PI-RK1:ABANDON ABILITY ABLE ABOUT ABOVE ABSENT ABSORB ABSTRACT ABSURD ABUSE ACCESS ACCIDENT ACCOUNT ACCUSE ACHIEVE ACID ACOUSTIC ACQUIRE ACROSS ACT ACTION ACTOR ACTRESS ACTUAL
          file_name: care-recovery-sunrise-clinic.txt
    RestorePoints:
      type: object
      additionalProperties: false
      description: The restore window and the restore points (`02` §6).
      required: [pitr, file_snapshots, generated_at, db_backups, checkpoints, destinations]
      properties:
        pitr:
          type: [object, 'null']
          additionalProperties: false
          description: The PITR window of the local repository. `null` without a backup.
          required: [from, to, timeline]
          properties:
            from:
              type: string
              format: date-time
              description: The earliest point in time (the end of the oldest full backup).
            to:
              type: string
              format: date-time
              description: The latest archived point. A restore job archives the current WAL segment first, so a time up to the start of the job is possible.
            timeline:
              type: integer
              minimum: 1
              description: The timeline now. A time restore follows the newest timeline that contains the time.
        file_snapshots:
          type: array
          description: The restic snapshots of each destination (`db` and `files`), newest first.
          items:
            $ref: '#/components/schemas/SnapshotInfo'
        generated_at:
          type: string
          format: date-time
          description: The time of this report.
        db_backups:
          type: array
          description: The backups of the local repository, newest first.
          items:
            $ref: '#/components/schemas/LocalBackup'
        checkpoints:
          type: array
          description: The checkpoints, newest first (design note section 13.11).
          items:
            $ref: '#/components/schemas/Checkpoint'
        destinations:
          type: array
          description: The list state of each destination.
          items:
            $ref: '#/components/schemas/SnapshotListing'
      examples:
        - pitr: {from: '2026-10-19T01:00:00Z', to: '2026-10-30T10:55:00Z', timeline: 1}
          file_snapshots:
            - {destination: usb, snapshot_id: 4f1e9a2c, time: '2026-10-30T10:45:00Z', contents: [db, config], size_bytes: 52428800, hostname: care, key_id: 1a2b3c4d}
            - {destination: usb, snapshot_id: 1a2b3c4d, time: '2026-10-30T02:30:00Z', contents: [files, config], size_bytes: 734003200, hostname: care, key_id: 1a2b3c4d}
          generated_at: '2026-10-30T10:56:00Z'
          db_backups:
            - {label: 20261026-010002F_20261030-020003I, type: incr, started_at: '2026-10-30T02:00:03Z', finished_at: '2026-10-30T02:00:08Z', size_bytes: 48500000, repo_size_bytes: 26000, reason: null}
          checkpoints: []
          destinations:
            - {id: usb, listed_at: '2026-10-30T10:45:40Z', ok: true, error: null, snapshot_count: 412}
    RestoreRequest:
      description: A restore on this device (`02` §6). `kind` selects the variant. For a new device, use `POST /restore/dr`.
      oneOf:
        - $ref: '#/components/schemas/RestorePitrRequest'
        - $ref: '#/components/schemas/RestoreFilesRequest'
      discriminator:
        propertyName: kind
        mapping:
          pitr: '#/components/schemas/RestorePitrRequest'
          files: '#/components/schemas/RestoreFilesRequest'
      examples:
        - kind: pitr
          time: '2026-10-30T09:40:00Z'
          checkpoint: null
          reason: undo the import of 09:42
    UpdatesOverview:
      x-phase: 4
      type: object
      additionalProperties: false
      description: The update state (Phase 4, `03` §3–§4).
