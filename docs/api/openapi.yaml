            frontend: {REACT_ALLOWED_LOCALES: 'en,ml'}
          fe: {provider: local}
          uploads: {max_body_mb: 200}
    ConfigPatch:
      type: object
      description: |
        A JSON merge patch (RFC 7396) for `config.yaml`. An object merges, a value replaces, `null` deletes.
        The agent validates the result against `Config`, not the patch.
      examples:
        - size: {preset: solo}
          env: {backend: {EMAIL_PORT: null}}
    JsonSchemaDocument:
      type: object
      description: A JSON Schema document (draft 2020-12).
      examples:
        - $schema: https://json-schema.org/draft/2020-12/schema
          title: care-pi config.yaml
          type: object
    ConfigChangeResult:
      type: object
      additionalProperties: false
      description: The result of `PUT /config` or `PATCH /config`.
      required: [written, etag, plan, job]
      properties:
        written:
          type: boolean
          description: The agent wrote `config.yaml`. `false` for `dry_run=true`.
        etag:
          $ref: '#/components/schemas/EntityTag'
        plan:
          $ref: '#/components/schemas/PlanPreview'
        job:
          description: The apply job (`apply=true`). Else `null`.
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'
      examples:
        - written: true
          etag: '"9f2c1a7e0b3d4c55"'
          plan:
            changed: true
            summary: {solution: care-clinic, track: stable, preset: solo, hostnames: [care.local], addresses: [192.168.1.10]}
            changes:
              - {path: /etc/containers/systemd/care-api.container, kind: modify}
            actions:
              - {kind: write-files, text: 'write-files: 1 file(s)', units: [], paths: [/etc/containers/systemd/care-api.container], names: [], reason: null}
              - {kind: daemon-reload, text: daemon-reload, units: [], paths: [], names: [], reason: null}
              - {kind: restart, text: 'restart: care-api.service', units: [care-api.service], paths: [], names: [], reason: null}
            fe_build: null
            impact: restart
            restarts: [care-api.service]
            lock_changed: false
            warnings: []
            diff: null
          job: null
    PlanPreview:
      type: object
      additionalProperties: false
      description: The plan of an apply, as `care-pi apply --dry-run` prints it.
      required: [changed, summary, changes, actions, fe_build, impact, restarts, lock_changed, warnings, diff]
      properties:
        changed:
          type: boolean
          description: The plan has an action. `false` is "no changes".
        summary:
          type: object
          additionalProperties: false
          description: The first lines of the apply output.
          required: [solution, track, preset, hostnames, addresses]
          properties:
            solution:
              type: string
              description: The solution.
              examples: [care-clinic]
            track:
              type: string
              enum: [stable, pinned, custom]
              description: The track.
            preset:
              type: string
              enum: [solo, small-clinic, busy-counter, custom]
              description: The preset.
            hostnames:
              type: array
              description: The host names.
              items:
                type: string
            addresses:
              type: array
              description: The LAN addresses.
              items:
                type: string
                format: ipv4
        changes:
          type: array
          description: The rendered files that change.
          items:
            $ref: '#/components/schemas/PlanChange'
        actions:
          type: array
          description: The actions in execution order (`docs/apply.md`, "Plan rules").
          items:
            $ref: '#/components/schemas/PlanAction'
        fe_build:
          description: The FE build that the plan needs. `null` when no FE build is necessary.
          oneOf:
            - $ref: '#/components/schemas/PlanFeBuild'
            - type: 'null'
        impact:
          type: string
          enum: [none, reload, restart, full-cycle]
          description: |
            The largest effect on Care. `none`: no restart. `reload`: Caddy reloads. `restart`: some containers restart
            (a short API break). `full-cycle`: the whole stack stops and starts.
        restarts:
          type: array
          description: The units that restart or start.
          items:
            type: string
          examples: [[care-api.service]]
        lock_changed:
          type: boolean
          description: The lock changes (a new digest or sha).
        warnings:
          type: array
          description: The warnings of the apply, for example a host name that differs from the OS host name.
          items:
            type: string
        diff:
          type: [string, 'null']
          description: The unified diff of the rendered files (`diff=true`). It never contains a secret.
      examples:
        - changed: false
          summary: {solution: care-clinic, track: stable, preset: small-clinic, hostnames: [care.local], addresses: [192.168.1.10]}
          changes: []
          actions: []
          fe_build: null
          impact: none
          restarts: []
          lock_changed: false
          warnings: []
          diff: null
    PlanChange:
      type: object
      additionalProperties: false
      description: One file change.
      required: [path, kind]
      properties:
        path:
          type: string
          description: The host path.
          examples: [/etc/care-pi/rendered/care/backend.env]
        kind:
          type: string
          enum: [add, modify, delete]
          description: The kind of change.
      examples:
        - path: /etc/care-pi/rendered/care/backend.env
          kind: modify
    PlanActionKind:
      type: string
      enum: [ensure-dirs, set-secrets, write-files, delete-files, daemon-reload, enable-target, pull-images, full-cycle, start-target, restart, reload-caddy, ensure-buckets, ensure-stanza, ensure-mounts, ensure-repositories, ensure-timers, ensure-fe, write-lock]
      description: |
        The action kinds of `agent/internal/plan`, in execution order. A later version can add kinds.
        Phase 3 adds `ensure-mounts` (the mount units of `disk_label` destinations), `ensure-repositories` (`restic init`
        of a new destination; a destination that does not answer does not fail the apply, design note section 13.5),
        and `ensure-timers` (turn the backup timers on or off, `backups.paused`).
      examples: [restart]
    PlanAction:
      type: object
      additionalProperties: false
      description: One action of the plan.
      required: [kind, text, units, paths, names, reason]
      properties:
        kind:
          $ref: '#/components/schemas/PlanActionKind'
        text:
          type: string
          description: The line that `care-pi apply` prints. The job step of this action has the same name.
          examples: ['restart: care-beat.service care-worker.service care-api.service']
        units:
          type: array
          description: The units of the action.
          items:
            type: string
        paths:
          type: array
          description: The files of the action.
          items:
            type: string
        names:
          type: array
          description: Other names (podman secrets, images).
          items:
            type: string
        reason:
          type: [string, 'null']
          description: Why the action is in the plan.
      examples:
        - kind: restart
          text: 'restart: care-beat.service care-worker.service care-api.service'
          units: [care-beat.service, care-worker.service, care-api.service]
          paths: []
          names: []
          reason: null
    PlanFeBuild:
      type: object
      additionalProperties: false
      description: The FE build of the plan.
      required: [build_id, provider, exists]
      properties:
        build_id:
          type: string
          description: The FE build id.
          examples: [8d2f0c1a9b7e]
        provider:
          type: string
          enum: [artifact, local]
          description: The provider that makes the build.
        exists:
          type: boolean
          description: The build is on disk. Then apply only points `fe/current` at it.
      examples:
        - build_id: 8d2f0c1a9b7e
          provider: local
          exists: false
    MemoryCap:
      type: object
      additionalProperties: false
      description: The `MemoryMax` and `MemorySwapMax` of one unit, in MiB.
      required: [max_mb, swap_max_mb]
      properties:
        max_mb:
          type: integer
          minimum: 1
          description: '`MemoryMax`.'
        swap_max_mb:
          type: integer
          minimum: 0
          description: '`MemorySwapMax`.'
      examples:
        - max_mb: 512
          swap_max_mb: 128
    Preset:
      type: object
      additionalProperties: false
      description: One preset (CPU and memory). `custom` has `null` values; the operator sets them.
      required: [name, gunicorn_workers, celery_concurrency, pg_shared_buffers_mb, memory, recommended, warning]
      properties:
        name:
          type: string
          enum: [solo, small-clinic, busy-counter, custom]
          description: The preset name.
        gunicorn_workers:
          type: [integer, 'null']
          description: The gunicorn workers of care-api.
        celery_concurrency:
          type: [integer, 'null']
          description: The concurrency of care-worker.
        pg_shared_buffers_mb:
          type: [integer, 'null']
          description: The Postgres `shared_buffers`.
        memory:
          type: [object, 'null']
          description: The memory caps by unit (`docs/config.md`). `null` for `custom`.
          propertyNames:
            pattern: '^care-[a-z0-9]+$'
          additionalProperties:
            $ref: '#/components/schemas/MemoryCap'
        recommended:
          type: boolean
          description: The agent recommends this preset for the RAM of this host. The easy path hides a preset with a warning.
        warning:
          type: [string, 'null']
          description: A warning code for this host, for example `busy-counter-low-ram`.
          examples: [busy-counter-low-ram]
      examples:
        - name: small-clinic
          gunicorn_workers: 2
          celery_concurrency: 1
          pg_shared_buffers_mb: 128
          memory:
            care-api: {max_mb: 512, swap_max_mb: 128}
            care-worker: {max_mb: 384, swap_max_mb: 128}
            care-beat: {max_mb: 512, swap_max_mb: 128}
            care-db: {max_mb: 384, swap_max_mb: 0}
            care-redis: {max_mb: 96, swap_max_mb: 0}
            care-s3: {max_mb: 256, swap_max_mb: 0}
            care-caddy: {max_mb: 96, swap_max_mb: 0}
          recommended: true
          warning: null
    PresetList:
      type: object
      additionalProperties: false
      description: The presets in the order of size.
      required: [default, host_ram_bytes, items]
      properties:
        default:
          type: string
          const: small-clinic
          description: The default preset.
        host_ram_bytes:
          type: integer
          minimum: 0
          description: '`MemTotal` of this host.'
          examples: [2122317824]
        items:
          type: array
          description: '`solo`, `small-clinic`, `busy-counter`, `custom`.'
          items:
            $ref: '#/components/schemas/Preset'
      examples:
        - default: small-clinic
          host_ram_bytes: 2122317824
          items:
            - name: solo
              gunicorn_workers: 1
              celery_concurrency: 1
              pg_shared_buffers_mb: 128
              memory: {care-api: {max_mb: 320, swap_max_mb: 64}}
              recommended: false
              warning: null
            - name: custom
              gunicorn_workers: null
              celery_concurrency: null
              pg_shared_buffers_mb: null
              memory: null
              recommended: false
              warning: null
    ApplyRequest:
      type: object
      additionalProperties: false
      description: The options of `care-pi apply`.
      properties:
        reason:
          type: [string, 'null']
          maxLength: 200
          description: A text for the job journal (`--reason`).
          examples: [preset change]
        update:
          type: boolean
          default: false
          description: Resolve the tracked refs again (`--update`).
      examples:
        - reason: preset change
          update: false
    JobId:
      type: string
      pattern: '^[0-9]{8}T[0-9]{6}\.[0-9]{3}Z-[a-z][a-z-]*$'
      description: |
        The id of a job: the UTC start time and the kind. It is the name of the journal file without `.json`
        (`/var/lib/care-pi/state/jobs/<id>.json`). The ids sort by time.
      examples: [20261030T101500.123Z-apply]
    JobKind:
      type: string
      enum: [apply, setup, fe-build, fe-prune, support-bundle, update-check, update, rollback, tls, backup-run, backup-verify, restore-pitr, restore-files, restore-dr, disk-prepare, recovery-key-rotate, restore-drill]
      description: |
        The kind of job. These kinds hold the apply lock: `apply`, `setup`, `fe-build`, `fe-prune`, `update`,
        `rollback`, `tls`, and the Phase 3 kinds `restore-pitr`, `restore-files`, `restore-dr`, `disk-prepare`, `recovery-key-rotate`.
        Phase 2 makes `apply`, `setup`, `fe-build`, `fe-prune`, `support-bundle`.
        Phase 3 makes `backup-run`, `backup-verify`, `restore-pitr`, `restore-files`, `restore-dr`, `disk-prepare`,
        `recovery-key-rotate`, `restore-drill` (design note section 13.8). Phase 4 adds `update-check`, `update`, `rollback`. Phase 6 adds `tls`.
      examples: [apply]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      description: |
        `queued`: the job waits for the apply lock (5 s at most) or for a free worker. `running`: a step runs.
        `succeeded`, `failed`, `cancelled`: the job ended.
        A journal of Phase 1 maps so: `result: running` → `running`, `ok` → `succeeded`, `failed` → `failed`.
        When no process holds the apply lock, `result: running` → `failed` with the problem `internal` and the detail "interrupted".
      examples: [running]
    JobStepState:
      type: string
      enum: [pending, running, succeeded, failed, skipped, cancelled]
      description: |
        The state of a step. A Phase 1 journal step without `finished` is `running` (or `failed` after a crash),
        a step with `error` is `failed`, else `succeeded`.
      examples: [succeeded]
    JobStep:
      type: object
      additionalProperties: false
      description: One step of a job. The step list can grow while the job runs (the plan actions come after the plan step).
      required: [index, name, action, state, started_at, finished_at, detail]
      properties:
        index:
          type: integer
          minimum: 0
          description: The position in the step list. It never changes.
        name:
          type: string
          description: The text of the step. For a plan action it is the line that `care-pi apply` prints (journal `name`).
          examples: ['restart: care-api.service']
        action:
          type: [string, 'null']
          pattern: '^[a-z][a-z-]*$'
          description: |
            A stable key of the step. For a plan action: a `PlanActionKind`. Other keys: `validate`, `host-check`,
            `resolve-lock`, `render`, `plan`, `wait-healthy`, `set-hostname`, `create-care-superuser`, `collect`, `archive`, `prune`.
            Phase 3 keys (design note section 13.8): `pause-backups`, `resume-backups`, `maintenance-on`, `maintenance-off`,
            `stop-app`, `start-app`, `stop-db`, `start-db`, `wait-promote`, `checkpoint`, `backup-incr`, `backup-full`,
            `check-stanza`, `snapshot`, `forget`, `verify-local`, `verify-destination`, `check-space`, `check-key`,
            `check-destinations`, `restore-db`, `restore-files`, `verify-files`, `stop-s3`, `start-s3`, `fetch-config`,
            `fetch-db-repo`, `fetch-files`, `restore-account`, `finish`, `check-disk`, `wipe-disk`, `partition`, `format`,
            `write-mount-unit`, `mount`, `rekey-local`, `init-destination`, `activate-key`, `remove-old-repositories`,
            `drill-restore`, `drill-start`, `drill-check`, `drill-cleanup`.
            `null` for a journal of Phase 1 when the name does not start with a known key.
          examples: [restart]
        state:
          $ref: '#/components/schemas/JobStepState'
        started_at:
          type: [string, 'null']
          format: date-time
          description: The start of the step (journal `started`).
        finished_at:
          type: [string, 'null']
          format: date-time
          description: The end of the step (journal `finished`).
        detail:
          type: [string, 'null']
          description: The error of a failed step (journal `error`), or a short result.
          examples: [care-api.service did not become healthy in 5m0s]
      examples:
        - index: 2
          name: 'restart: care-api.service'
          action: restart
          state: succeeded
          started_at: '2026-10-30T10:15:02Z'
          finished_at: '2026-10-30T10:15:24Z'
          detail: null
    Job:
      type: object
      additionalProperties: false
      description: A job, from its journal file.
      required: [id, kind, state, source, reason, created_at, started_at, finished_at, cancellable, steps, error, result, last_event_id]
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        kind:
          $ref: '#/components/schemas/JobKind'
        state:
          $ref: '#/components/schemas/JobState'
        source:
          type: string
          enum: [console, cli, timer]
          description: What started the job. Phase 1 journals are `cli`.
        reason:
          type: [string, 'null']
          description: The reason (journal `reason`).
          examples: [preset change]
        created_at:
          type: string
          format: date-time
          description: The creation of the job.
        started_at:
          type: [string, 'null']
          format: date-time
          description: The start of the first step (journal `started`). `null` while `queued`.
        finished_at:
          type: [string, 'null']
          format: date-time
          description: The end of the job (journal `finished`).
        cancellable:
          type: boolean
          description: '`POST /jobs/{job_id}/cancel` is possible now.'
        steps:
          type: array
          description: The steps in order.
          items:
            $ref: '#/components/schemas/JobStep'
        error:
          description: Why the job failed (journal `error` in `detail`). `null` unless the state is `failed`.
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        result:
          description: The result of a job that succeeded. `null` for the other states, and for kinds without a result.
          oneOf:
            - $ref: '#/components/schemas/JobResult'
            - type: 'null'
        last_event_id:
          type: integer
          minimum: 0
          description: The id of the last event of the job. `0` before the first event.
      examples:
        - id: 20261030T101500.123Z-apply
          kind: apply
          state: succeeded
          source: console
          reason: preset change
          created_at: '2026-10-30T10:15:00.123Z'
          started_at: '2026-10-30T10:15:00.200Z'
          finished_at: '2026-10-30T10:15:24Z'
          cancellable: false
          steps:
            - {index: 0, name: 'write-files: 1 file(s)', action: write-files, state: succeeded, started_at: '2026-10-30T10:15:00.200Z', finished_at: '2026-10-30T10:15:00.300Z', detail: null}
            - {index: 1, name: daemon-reload, action: daemon-reload, state: succeeded, started_at: '2026-10-30T10:15:00.300Z', finished_at: '2026-10-30T10:15:02Z', detail: null}
            - {index: 2, name: 'restart: care-api.service', action: restart, state: succeeded, started_at: '2026-10-30T10:15:02Z', finished_at: '2026-10-30T10:15:24Z', detail: null}
          error: null
          result:
            kind: apply
            changed: true
            lock_changed: false
            fe_build_id: null
          last_event_id: 7
    JobSummary:
      type: object
      additionalProperties: false
      description: A short form of a job for lists.
      required: [id, kind, state, source, created_at, started_at, finished_at, step, error_title]
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        kind:
          $ref: '#/components/schemas/JobKind'
        state:
          $ref: '#/components/schemas/JobState'
        source:
          type: string
          enum: [console, cli, timer]
          description: What started the job.
        created_at:
          type: string
          format: date-time
          description: The creation of the job.
        started_at:
          type: [string, 'null']
          format: date-time
          description: The start of the job.
        finished_at:
          type: [string, 'null']
          format: date-time
          description: The end of the job.
        step:
          type: [string, 'null']
          description: The name of the step that runs now. `null` when the job does not run.
        error_title:
          type: [string, 'null']
          description: The `title` of the error of a failed job.
      examples:
        - id: 20261030T101500.123Z-apply
          kind: apply
          state: running
          source: console
          created_at: '2026-10-30T10:15:00.123Z'
          started_at: '2026-10-30T10:15:00.200Z'
          finished_at: null
          step: 'restart: care-api.service'
          error_title: null
    JobList:
      type: object
      additionalProperties: false
      description: One page of jobs, newest first.
      required: [items, next_before]
      properties:
        items:
          type: array
          description: The jobs.
          items:
            $ref: '#/components/schemas/JobSummary'
        next_before:
          description: Send it as `before` for the next page. `null` on the last page.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
      examples:
        - items:
            - id: 20261030T101500.123Z-apply
              kind: apply
              state: succeeded
              source: cli
              created_at: '2026-10-30T10:15:00.123Z'
              started_at: '2026-10-30T10:15:00.123Z'
              finished_at: '2026-10-30T10:15:24Z'
              step: null
              error_title: null
          next_before: null
    JobResult:
      description: The result of a job, by kind.
      oneOf:
        - $ref: '#/components/schemas/ApplyResult'
        - $ref: '#/components/schemas/SetupResult'
        - $ref: '#/components/schemas/FeBuildResult'
        - $ref: '#/components/schemas/FePruneResult'
        - $ref: '#/components/schemas/SupportBundleResult'
        - $ref: '#/components/schemas/BackupRunResult'
        - $ref: '#/components/schemas/BackupVerifyResult'
        - $ref: '#/components/schemas/RestorePitrResult'
        - $ref: '#/components/schemas/RestoreFilesResult'
        - $ref: '#/components/schemas/RestoreDrResult'
        - $ref: '#/components/schemas/DiskPrepareResult'
        - $ref: '#/components/schemas/RecoveryKeyRotateResult'
        - $ref: '#/components/schemas/RestoreDrillResult'
      discriminator:
        propertyName: kind
        mapping:
          apply: '#/components/schemas/ApplyResult'
          setup: '#/components/schemas/SetupResult'
          fe-build: '#/components/schemas/FeBuildResult'
          fe-prune: '#/components/schemas/FePruneResult'
          support-bundle: '#/components/schemas/SupportBundleResult'
          backup-run: '#/components/schemas/BackupRunResult'
          backup-verify: '#/components/schemas/BackupVerifyResult'
          restore-pitr: '#/components/schemas/RestorePitrResult'
          restore-files: '#/components/schemas/RestoreFilesResult'
          restore-dr: '#/components/schemas/RestoreDrResult'
          disk-prepare: '#/components/schemas/DiskPrepareResult'
          recovery-key-rotate: '#/components/schemas/RecoveryKeyRotateResult'
          restore-drill: '#/components/schemas/RestoreDrillResult'
      examples:
        - kind: fe-prune
          removed: [1a2b3c4d5e6f]
    ApplyResult:
      type: object
      additionalProperties: false
      description: The result of an apply job.
      required: [kind, changed, lock_changed, fe_build_id]
      properties:
        kind:
          type: string
          const: apply
          description: The job kind.
        changed:
          type: boolean
          description: The plan had actions. `false` is "no changes".
        lock_changed:
          type: boolean
          description: The apply wrote a new lock.
        fe_build_id:
          type: [string, 'null']
          description: The FE build that `fe/current` points at now, when the apply changed it.
      examples:
        - kind: apply
          changed: true
          lock_changed: false
          fe_build_id: null
    SetupResult:
      type: object
      additionalProperties: false
      description: The result of the finish job. The console shows the hand-off page with it.
      required: [kind, care_url, console_url, handoff_url, urls, care_username]
      properties:
        kind:
          type: string
          const: setup
          description: The job kind.
        care_url:
          type: string
          format: uri
          description: Care on the primary host name. After a host name change, it is the new name.
          examples: [https://care.local/]
        console_url:
          type: string
          format: uri
          description: The console on the primary host name (port 8443).
          examples: ['https://care.local:8443/']
        handoff_url:
          type: string
          format: uri
          description: The Care login page. The console shows it as a link and a QR code.
          examples: [https://care.local/login]
        urls:
          type: array
          description: Care on each host name and LAN address.
          items:
            type: string
            format: uri
          examples: [[https://care.local/, https://192.168.1.10/]]
        care_username:
          type: [string, 'null']
          description: The Care superuser that the job created.
          examples: [admin]
      examples:
        - kind: setup
          care_url: https://care.local/
          console_url: 'https://care.local:8443/'
          handoff_url: https://care.local/login
          urls: [https://care.local/, https://192.168.1.10/]
          care_username: admin
    FeBuildResult:
      type: object
      additionalProperties: false
      description: The result of an FE build job.
      required: [kind, build_id, provider, duration_s]
      properties:
        kind:
          type: string
          const: fe-build
          description: The job kind.
        build_id:
          type: string
          description: The FE build id that `fe/current` points at now.
          examples: [8d2f0c1a9b7e]
        provider:
          type: string
          enum: [artifact, local]
          description: The provider that made the build.
        duration_s:
          type: number
          minimum: 0
          description: The time of the build.
          examples: [61.4]
      examples:
        - kind: fe-build
          build_id: 8d2f0c1a9b7e
          provider: local
          duration_s: 61.4
    FePruneResult:
      type: object
      additionalProperties: false
      description: The result of an FE prune job.
      required: [kind, removed]
      properties:
        kind:
          type: string
          const: fe-prune
          description: The job kind.
        removed:
          type: array
          description: The removed builds and temporary directories.
          items:
            type: string
          examples: [[1a2b3c4d5e6f]]
      examples:
        - kind: fe-prune
          removed: [1a2b3c4d5e6f]
    SupportBundleResult:
      type: object
      additionalProperties: false
      description: The result of a support-bundle job.
      required: [kind, bundle_id, filename, size_bytes, sha256, expires_at, download_path]
      properties:
        kind:
          type: string
          const: support-bundle
          description: The job kind.
        bundle_id:
          $ref: '#/components/schemas/BundleId'
        filename:
          type: string
          description: The file name for the download.
          examples: [care-pi-support-care-20261030T110000Z.tar.gz]
        size_bytes:
          type: integer
          minimum: 0
          description: The size of the bundle.
          examples: [482133]
        sha256:
          $ref: '#/components/schemas/Sha256Hex'
        expires_at:
          type: string
          format: date-time
          description: The agent deletes the bundle at this time (24 h).
        download_path:
          type: string
          format: uri-reference
          description: The path of `GET /support-bundle/{bundle_id}`.
          examples: [/api/v1/support-bundle/20261030T110000.000Z-support-bundle]
      examples:
        - kind: support-bundle
          bundle_id: 20261030T110000.000Z-support-bundle
          filename: care-pi-support-care-20261030T110000Z.tar.gz
          size_bytes: 482133
          sha256: 3f1d6c0e5a2b9e4d7c8f1a0b2c3d4e5f60718293a4b5c6d7e8f9011223344556
          expires_at: '2026-10-31T11:00:00Z'
          download_path: /api/v1/support-bundle/20261030T110000.000Z-support-bundle
    BundleId:
      type: string
      pattern: '^[0-9]{8}T[0-9]{6}\.[0-9]{3}Z-support-bundle$'
      description: The id of a support bundle. It is the id of the job that made it.
      examples: [20261030T110000.000Z-support-bundle]
    JobEvent:
      description: |
        One event of a job. In SSE, `id`, `event`, and `data` are the lines of the frame. In JSON, they are members.
        `step`: a step changed its state. `log`: one output line. `progress`: the progress of a long step.
        `error`: a step or the job reports a problem; the job can continue.
        `done`: the job ended; it is the last event, and the stream closes.
        `heartbeat` comes every 15 s, only in SSE, and has no `id`.
      oneOf:
        - $ref: '#/components/schemas/JobStepEvent'
        - $ref: '#/components/schemas/JobLogEvent'
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/JobErrorEvent'
        - $ref: '#/components/schemas/JobDoneEvent'
        - $ref: '#/components/schemas/HeartbeatEvent'
      discriminator:
        propertyName: event
        mapping:
          step: '#/components/schemas/JobStepEvent'
          log: '#/components/schemas/JobLogEvent'
          progress: '#/components/schemas/JobProgressEvent'
          error: '#/components/schemas/JobErrorEvent'
          done: '#/components/schemas/JobDoneEvent'
          heartbeat: '#/components/schemas/HeartbeatEvent'
      examples:
        - id: 4
          event: log
          data: {time: '2026-10-30T10:15:03Z', step_index: 2, stream: agent, line: waiting for care-api.service to become healthy}
    EventId:
      type: integer
      minimum: 1
      description: The id of an event. It starts at 1 for each job and increases by 1.
      examples: [4]
    JobStepEvent:
      type: object
      additionalProperties: false
      description: A step changed its state. `data` is the step after the change.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          type: string
          const: step
          description: The event type.
        data:
          $ref: '#/components/schemas/JobStep'
      examples:
        - id: 1
          event: step
          data: {index: 0, name: 'write-files: 2 file(s)', action: write-files, state: running, started_at: '2026-10-30T10:15:00Z', finished_at: null, detail: null}
    JobLogEvent:
      type: object
      additionalProperties: false
      description: One output line of a job.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          type: string
          const: log
          description: The event type.
        data:
          $ref: '#/components/schemas/JobLogLine'
      examples:
        - id: 4
          event: log
          data: {time: '2026-10-30T10:15:03Z', step_index: 2, stream: agent, line: waiting for care-api.service to become healthy}
    JobLogLine:
      type: object
      additionalProperties: false
      description: One output line. The agent removes secret values from each line.
      required: [time, step_index, stream, line]
      properties:
        time:
          type: string
          format: date-time
          description: The time of the line.
        step_index:
          type: [integer, 'null']
          minimum: 0
          description: The step that wrote the line. `null` for a line of the job itself.
        stream:
          type: string
          enum: [agent, stdout, stderr]
          description: '`agent`: a line of care-pi. `stdout` and `stderr`: a line of a command (for example the FE build).'
        line:
          type: string
          maxLength: 4096
          description: The text, without the line break. The agent cuts longer lines.
          examples: ['resolve docker.io/library/redis:8-alpine … 21090af93f83']
      examples:
        - time: '2026-10-30T10:15:03Z'
          step_index: 0
          stream: agent
          line: 'resolve docker.io/library/redis:8-alpine … 21090af93f83'
    JobProgressEvent:
      type: object
      additionalProperties: false
      description: The progress of a long step (an image pull, a download, an FE build).
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          type: string
          const: progress
          description: The event type.
        data:
          $ref: '#/components/schemas/JobProgress'
      examples:
        - id: 12
          event: progress
          data: {step_index: 4, current: 524288000, total: 1073741824, unit: bytes, message: pull ghcr.io/ohcnetwork/care}
    JobProgress:
      type: object
      additionalProperties: false
      description: The progress of one step. The agent sends one progress event each second at most for a step.
      required: [step_index, current, total, unit, message]
      properties:
        step_index:
          type: integer
          minimum: 0
          description: The step.
        current:
          type: number
          minimum: 0
          description: The work that is done.
        total:
          type: [number, 'null']
          minimum: 0
          description: The total work. `null` when not known.
        unit:
          type: string
          enum: [bytes, items, percent]
          description: The unit of `current` and `total`.
        message:
          type: [string, 'null']
          description: A short text.
          examples: [pull ghcr.io/ohcnetwork/care]
      examples:
        - step_index: 4
          current: 524288000
          total: 1073741824
          unit: bytes
          message: pull ghcr.io/ohcnetwork/care
    JobErrorEvent:
      type: object
      additionalProperties: false
      description: |
        A step or the job reports a problem. The job can continue: for example, a failed FE build does not stop
        the other steps of an apply. The job state is in the `done` event.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          type: string
          const: error
          description: The event type.
        data:
          $ref: '#/components/schemas/Problem'
      examples:
        - id: 30
          event: error
          data:
            type: https://care-pi.rithviknishad.dev/problems/internal
            title: Internal error
            status: 500
            detail: 'ensure-fe: the FE build failed with exit code 1'
            instance: /api/v1/jobs/20261030T101500.123Z-apply
    JobDoneEvent:
      type: object
      additionalProperties: false
      description: The job ended. `data` is the final job. The agent closes the stream after this event.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          type: string
          const: done
          description: The event type.
        data:
          $ref: '#/components/schemas/Job'
      examples:
        - id: 3
          event: done
          data:
            id: 20261030T110000.000Z-fe-prune
            kind: fe-prune
            state: succeeded
            source: console
            reason: null
            created_at: '2026-10-30T11:00:00Z'
            started_at: '2026-10-30T11:00:00Z'
            finished_at: '2026-10-30T11:00:01Z'
            cancellable: false
            steps:
              - {index: 0, name: prune, action: prune, state: succeeded, started_at: '2026-10-30T11:00:00Z', finished_at: '2026-10-30T11:00:01Z', detail: null}
            error: null
            result: {kind: fe-prune, removed: [1a2b3c4d5e6f]}
            last_event_id: 3
    HeartbeatEvent:
      type: object
      additionalProperties: false
      description: Every 15 s in an SSE stream, so that proxies keep the connection. It has no `id`.
      required: [event, data]
      properties:
        event:
          type: string
          const: heartbeat
          description: The event type.
        data:
          type: object
          additionalProperties: false
          description: The time of the agent.
          required: [time]
          properties:
            time:
              type: string
              format: date-time
              description: The clock of the host.
      examples:
        - event: heartbeat
          data: {time: '2026-10-30T10:15:15Z'}
    JobEventPage:
      type: object
      additionalProperties: false
      description: The JSON form of `GET /jobs/{job_id}/events`. It never has `heartbeat` events.
      required: [job_id, events, last_event_id, done]
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        events:
          type: array
          maxItems: 1000
          description: The events after `after`, oldest first, 1000 at most.
          items:
            $ref: '#/components/schemas/JobEvent'
        last_event_id:
          type: integer
          minimum: 0
          description: Send it as `after` for the next page.
        done:
          type: boolean
          description: The job ended and the page has the `done` event.
      examples:
        - job_id: 20261030T101500.123Z-apply
          events:
            - id: 1
              event: step
              data: {index: 0, name: 'write-files: 1 file(s)', action: write-files, state: running, started_at: '2026-10-30T10:15:00.200Z', finished_at: null, detail: null}
          last_event_id: 1
          done: false
    LogUnit:
      type: string
      enum: [api, worker, beat, db, redis, s3, caddy, pod, clock, fe-build, target, agent, backup]
      description: |
        The short names of `care-pi logs`. `agent` is `care-pi.service` (new in Phase 2). `target` is `care.target`.
        `backup` is each `care-backup-*.service` (the backup timers, new in Phase 3).
        Each other name `X` is `care-X.service`.
      examples: [api]
    LogUnitInfo:
      type: object
      additionalProperties: false
      description: One unit with a journal.
      required: [name, unit]
      properties:
        name:
          $ref: '#/components/schemas/LogUnit'
        unit:
          type: string
          description: The systemd unit.
          examples: [care-api.service]
      examples:
        - name: api
          unit: care-api.service
    LogUnitList:
      type: object
      additionalProperties: false
      description: The units with a journal.
      required: [items]
      properties:
        items:
          type: array
          description: In the order of `LogUnit`.
          items:
            $ref: '#/components/schemas/LogUnitInfo'
      examples:
        - items:
            - {name: api, unit: care-api.service}
            - {name: agent, unit: care-pi.service}
    JournalCursor:
      type: string
      maxLength: 512
      pattern: '^[a-z]=[0-9a-f]+(;[a-z]=[0-9a-f]+)*$'
      description: A journal cursor (`journalctl --show-cursor`).
      examples: [s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f]
    LogLine:
      type: object
      additionalProperties: false
      description: One journal line.
      required: [time, cursor, priority, unit, message]
      properties:
        time:
          type: string
          format: date-time
          description: The time of the line (`__REALTIME_TIMESTAMP`).
        cursor:
          $ref: '#/components/schemas/JournalCursor'
        priority:
          type: integer
          minimum: 0
          maximum: 7
          description: The syslog priority (0 emergency to 7 debug).
        unit:
          type: string
          description: The systemd unit.
          examples: [care-api.service]
        message:
          type: string
          maxLength: 16384
          description: The text. The agent cuts longer lines.
          examples: ['Booting worker with pid: 12']
      examples:
        - time: '2026-10-30T10:15:00Z'
          cursor: s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f
          priority: 6
          unit: care-api.service
          message: 'Booting worker with pid: 12'
    LogPage:
      type: object
      additionalProperties: false
      description: One page of journal lines, oldest first.
      required: [unit, lines, next_cursor]
      properties:
        unit:
          $ref: '#/components/schemas/LogUnit'
        lines:
          type: array
          description: The lines.
          items:
            $ref: '#/components/schemas/LogLine'
        next_cursor:
          description: The cursor of the last line. Send it as `after` for the next page. `null` when the page is empty.
          oneOf:
            - $ref: '#/components/schemas/JournalCursor'
            - type: 'null'
      examples:
        - unit: api
          lines:
            - time: '2026-10-30T10:15:00Z'
              cursor: s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f
              priority: 6
              unit: care-api.service
              message: 'Booting worker with pid: 12'
          next_cursor: s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f
    SupportBundleRequest:
      type: object
      additionalProperties: false
      description: The options of the support bundle.
      properties:
        log_lines:
          type: integer
          minimum: 100
          maximum: 10000
          default: 1000
          description: The last lines of each journal.
        since_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 24
          description: Only journal lines of the last N hours.
      examples:
        - log_lines: 1000
          since_hours: 24
    Network:
      type: object
      additionalProperties: false
      description: The network state.
      required: [hostname, os_hostname, mdns, addresses, published, address_changed, interfaces, gateway, dns_servers, internet, dhcp_hint, urls, wifi]
      properties:
        hostname:
          type: string
          description: '`identity.hostname`.'
          examples: [care]
        os_hostname:
          type: string
          description: The OS host name. Keep it equal to `hostname` (`docs/config.md`).
          examples: [care]
        mdns:
          type: object
          additionalProperties: false
          description: The mDNS name.
          required: [configured, advertised, collision]
          properties:
            configured:
              type: string
              description: '`<hostname>.local`.'
              examples: [care.local]
            advertised:
              type: [string, 'null']
              description: The name that avahi announces. `null` when avahi does not run.
              examples: [care-2.local]
            collision:
              type: boolean
              description: '`advertised` differs from `configured`.'
        addresses:
          type: array
          description: The LAN IPv4 addresses (the rules of `docs/config.md`, `network`).
          items:
            type: string
            format: ipv4
        published:
          type: array
          description: The addresses in the rendered `care.pod`.
          items:
            type: string
            format: ipv4
        address_changed:
          type: boolean
          description: '`addresses` differs from `published`.'
        interfaces:
          type: array
          description: The interfaces that care-pi does not ignore.
          items:
            $ref: '#/components/schemas/NetworkInterface'
        gateway:
          type: [string, 'null']
          format: ipv4
          description: The default IPv4 gateway.
          examples: [192.168.1.1]
        dns_servers:
          type: array
          description: The DNS servers of the host.
          items:
            type: string
          examples: [[192.168.1.1]]
        internet:
          type: object
          additionalProperties: false
          description: The last internet check (every 5 minutes).
          required: [reachable, checked_at]
          properties:
            reachable:
              type: [boolean, 'null']
              description: A HTTPS request to the internet worked. `null` before the first check.
            checked_at:
              type: [string, 'null']
              format: date-time
              description: The time of the check.
        dhcp_hint:
          description: The address to reserve in the DHCP server of the router. `null` when the address is static.
          oneOf:
            - $ref: '#/components/schemas/DhcpHint'
            - type: 'null'
        urls:
          type: array
          description: The URLs of Care, for the QR code of other devices.
          items:
            type: string
            format: uri
          examples: [[https://care.local/, https://192.168.1.10/]]
        wifi:
          x-phase: 6
          description: The Wi-Fi state (Phase 6). `null` before Phase 6.
          oneOf:
            - $ref: '#/components/schemas/WifiState'
            - type: 'null'
      examples:
        - hostname: care
          os_hostname: care
          mdns: {configured: care.local, advertised: care.local, collision: false}
          addresses: [192.168.1.10]
          published: [192.168.1.10]
          address_changed: false
          interfaces:
            - name: eth0
              kind: ethernet
              mac: 'd8:3a:dd:00:11:22'
              link: true
              speed_mbps: 1000
              addresses:
                - {address: 192.168.1.10, prefix_length: 24, family: ipv4, dynamic: true}
                - {address: 'fd00::1a2b:3c4d', prefix_length: 64, family: ipv6, dynamic: true}
          gateway: 192.168.1.1
          dns_servers: [192.168.1.1]
          internet: {reachable: true, checked_at: '2026-10-30T10:55:00Z'}
          dhcp_hint: {interface: eth0, mac: 'd8:3a:dd:00:11:22', address: 192.168.1.10}
          urls: [https://care.local/, https://192.168.1.10/]
          wifi: null
    NetworkInterface:
      type: object
      additionalProperties: false
      description: One network interface.
      required: [name, kind, mac, link, speed_mbps, addresses]
      properties:
        name:
          type: string
          description: The interface name.
          examples: [eth0]
        kind:
          type: string
          enum: [ethernet, wifi, other]
          description: The kind of interface.
        mac:
          type: [string, 'null']
          pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
          description: The MAC address.
          examples: ['d8:3a:dd:00:11:22']
        link:
          type: boolean
          description: The link is up.
        speed_mbps:
          type: [integer, 'null']
          description: The link speed.
          examples: [1000]
        addresses:
          type: array
          description: The addresses of the interface.
          items:
            $ref: '#/components/schemas/InterfaceAddress'
      examples:
        - name: eth0
          kind: ethernet
          mac: 'd8:3a:dd:00:11:22'
          link: true
          speed_mbps: 1000
          addresses:
            - {address: 192.168.1.10, prefix_length: 24, family: ipv4, dynamic: true}
    InterfaceAddress:
      type: object
      additionalProperties: false
      description: One address of an interface.
      required: [address, prefix_length, family, dynamic]
      properties:
        address:
          type: string
          description: The address.
          examples: [192.168.1.10]
        prefix_length:
          type: integer
          minimum: 0
          maximum: 128
          description: The prefix length.
          examples: [24]
        family:
          type: string
          enum: [ipv4, ipv6]
          description: The address family.
        dynamic:
          type: boolean
          description: DHCP or SLAAC gave the address.
      examples:
        - address: 192.168.1.10
          prefix_length: 24
          family: ipv4
          dynamic: true
    DhcpHint:
      type: object
      additionalProperties: false
      description: The values for a DHCP reservation in the router, so that the address does not change.
      required: [interface, mac, address]
      properties:
        interface:
          type: string
          description: The interface.
          examples: [eth0]
        mac:
          type: string
          pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
          description: The MAC address to reserve.
          examples: ['d8:3a:dd:00:11:22']
        address:
          type: string
          format: ipv4
          description: The address to reserve.
          examples: [192.168.1.10]
      examples:
        - interface: eth0
          mac: 'd8:3a:dd:00:11:22'
          address: 192.168.1.10
    WifiRequest:
      x-phase: 6
      type: object
      additionalProperties: false
      description: A Wi-Fi network (Phase 6).
      required: [ssid, psk, failover]
      properties:
        ssid:
          type: string
          minLength: 1
          maxLength: 32
          description: The network name.
          examples: [Sunrise-Staff]
        psk:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 63
          description: The WPA passphrase. The agent stores it in `/etc/care-pi/secrets/`.
          examples: [a wifi passphrase]
        failover:
          type: boolean
          description: Use Wi-Fi only when ethernet is down.
      examples:
        - ssid: Sunrise-Staff
          psk: a wifi passphrase
          failover: true
    WifiState:
      x-phase: 6
      type: object
      additionalProperties: false
      description: The Wi-Fi state (Phase 6).
      required: [ssid, connected, failover]
      properties:
        ssid:
          type: string
          description: The network name.
          examples: [Sunrise-Staff]
        connected:
          type: boolean
          description: The host is connected to the network.
        failover:
          type: boolean
          description: Wi-Fi is only a failover for ethernet.
      examples:
        - ssid: Sunrise-Staff
          connected: false
          failover: true
    TlsState:
      type: object
      additionalProperties: false
      description: The TLS modes. HSTS is never sent for the local CA names (07 F7).
      required: [local_ca, public, tailscale]
      properties:
        local_ca:
          type: object
          additionalProperties: false
          description: The local CA mode.
          required: [enabled, root, hostnames]
          properties:
            enabled:
              type: boolean
              description: '`tls.local_ca.enabled`.'
            root:
              description: The root CA. `null` when the CA does not exist yet.
              oneOf:
                - $ref: '#/components/schemas/CaRoot'
                - type: 'null'
            hostnames:
              type: array
              description: The names and addresses with a local CA certificate.
              items:
                type: string
              examples: [[care.local, 192.168.1.10]]
        public:
          x-phase: 6
          type: object
          additionalProperties: false
          description: The public certificate mode (Phase 6).
          required: [enabled, clinic_id, hostname]
          properties:
            enabled:
              type: boolean
              description: '`tls.public.enabled`.'
            clinic_id:
              type: [string, 'null']
              description: '`tls.public.clinic_id`.'
            hostname:
              type: [string, 'null']
              description: '`<clinic_id>.care-pi.rithviknishad.dev`.'
        tailscale:
          x-phase: 6
          type: object
          additionalProperties: false
          description: The Tailscale mode (Phase 6).
          required: [enabled, hostname]
          properties:
            enabled:
              type: boolean
              description: '`tls.tailscale.enabled`.'
            hostname:
              type: [string, 'null']
              description: The tailnet name.
      examples:
        - local_ca:
            enabled: true
            root:
              subject: CN=care-pi care.local Root CA
              fingerprint_sha256: 3f1d6c0e5a2b9e4d7c8f1a0b2c3d4e5f60718293a4b5c6d7e8f9011223344556
              fingerprint_sha256_colon: '3F:1D:6C:0E:5A:2B:9E:4D:7C:8F:1A:0B:2C:3D:4E:5F:60:71:82:93:A4:B5:C6:D7:E8:F9:01:12:23:34:45:56'
              not_before: '2026-10-30T10:00:00Z'
              not_after: '2036-10-27T10:00:00Z'
              name_constraints: null
            hostnames: [care.local, 192.168.1.10]
          public: {enabled: false, clinic_id: null, hostname: null}
          tailscale: {enabled: false, hostname: null}
    CaRoot:
      type: object
      additionalProperties: false
      description: The root CA certificate of the local CA.
      required: [subject, fingerprint_sha256, fingerprint_sha256_colon, not_before, not_after, name_constraints]
      properties:
        subject:
          type: string
          description: The subject of the certificate.
          examples: [CN=care-pi care.local Root CA]
        fingerprint_sha256:
          $ref: '#/components/schemas/Sha256Hex'
        fingerprint_sha256_colon:
          type: string
          pattern: '^[0-9A-F]{2}(:[0-9A-F]{2}){31}$'
          description: The same fingerprint as the OS certificate viewers show it.
          examples: ['3F:1D:6C:0E:5A:2B:9E:4D:7C:8F:1A:0B:2C:3D:4E:5F:60:71:82:93:A4:B5:C6:D7:E8:F9:01:12:23:34:45:56']
        not_before:
          type: string
          format: date-time
          description: The start of the validity.
        not_after:
          type: string
          format: date-time
          description: The end of the validity.
        name_constraints:
          x-phase: 7
          description: |
            The X.509 name constraints (07 §4.1). Phase 7 makes a root CA with name constraints.
            Until then the root is the root that Caddy makes, and this member is `null`.
          oneOf:
            - $ref: '#/components/schemas/NameConstraints'
            - type: 'null'
      examples:
        - subject: CN=care-pi care.local Root CA
          fingerprint_sha256: 3f1d6c0e5a2b9e4d7c8f1a0b2c3d4e5f60718293a4b5c6d7e8f9011223344556
          fingerprint_sha256_colon: '3F:1D:6C:0E:5A:2B:9E:4D:7C:8F:1A:0B:2C:3D:4E:5F:60:71:82:93:A4:B5:C6:D7:E8:F9:01:12:23:34:45:56'
          not_before: '2026-10-30T10:00:00Z'
          not_after: '2036-10-27T10:00:00Z'
          name_constraints: null
    NameConstraints:
      x-phase: 7
      type: object
      additionalProperties: false
      description: The permitted subtrees of the root CA (Phase 7, 07 §4.1).
      required: [permitted_dns_domains, permitted_ip_ranges]
      properties:
        permitted_dns_domains:
          type: array
          description: The DNS subtrees.
          items:
            type: string
          examples: [[.local, .care-pi.rithviknishad.dev]]
        permitted_ip_ranges:
          type: array
          description: The IP ranges in CIDR form.
          items:
            type: string
          examples: [[192.168.1.10/32]]
      examples:
        - permitted_dns_domains: [.local, .care-pi.rithviknishad.dev]
          permitted_ip_ranges: [192.168.1.10/32]
    ClientOs:
      type: string
      enum: [ios, android, windows, macos, linux, chromeos]
      description: The OS of a client device. iPadOS uses `ios`.
      examples: [ios]
    InstructionStep:
      type: object
      additionalProperties: false
      description: One step or note as a message key with parameters. The console has the text of each key.
      required: [key, params]
      properties:
        key:
          type: string
          pattern: '^tls\.(install|note)\.[a-z0-9.-]+$'
          description: The message key.
          examples: [tls.install.ios.trust-settings]
        params:
          type: object
          description: The values for the placeholders of the text.
          additionalProperties:
            type: string
          examples: [{name: care-pi care.local Root CA}]
      examples:
        - key: tls.install.ios.trust-settings
          params: {name: care-pi care.local Root CA}
    TlsInstructions:
      type: object
      additionalProperties: false
      description: The install steps of the root CA for one OS (07 §4.3).
      required: [os, root, steps, notes]
      properties:
        os:
          $ref: '#/components/schemas/ClientOs'
        root:
          type: object
          additionalProperties: false
          description: The file to download and the fingerprint to compare.
          required: [fingerprint_sha256, fingerprint_sha256_colon, filename, download_path, media_type]
          properties:
            fingerprint_sha256:
              $ref: '#/components/schemas/Sha256Hex'
            fingerprint_sha256_colon:
              type: string
              pattern: '^[0-9A-F]{2}(:[0-9A-F]{2}){31}$'
              description: The fingerprint as the OS shows it.
              examples: ['3F:1D:6C:0E:5A:2B:9E:4D:7C:8F:1A:0B:2C:3D:4E:5F:60:71:82:93:A4:B5:C6:D7:E8:F9:01:12:23:34:45:56']
            filename:
              type: string
              description: The file name of the download.
              examples: [care-pi-care-root-ca.mobileconfig]
            download_path:
              type: string
              format: uri-reference
              description: The path of the download for this OS, on the origin and below the prefix of the request.
              examples: [/api/v1/tls/root-ca/mobileconfig]
            media_type:
              type: string
              description: The media type of the download.
              examples: [application/x-apple-aspen-config]
        steps:
          type: array
          description: The steps in order.
          items:
            $ref: '#/components/schemas/InstructionStep'
        notes:
          type: array
          description: Notes for special cases (for example Firefox on Android).
          items:
            $ref: '#/components/schemas/InstructionStep'
      examples:
        - os: ios
          root:
            fingerprint_sha256: 3f1d6c0e5a2b9e4d7c8f1a0b2c3d4e5f60718293a4b5c6d7e8f9011223344556
            fingerprint_sha256_colon: '3F:1D:6C:0E:5A:2B:9E:4D:7C:8F:1A:0B:2C:3D:4E:5F:60:71:82:93:A4:B5:C6:D7:E8:F9:01:12:23:34:45:56'
            filename: care-pi-care-root-ca.mobileconfig
            download_path: /api/v1/tls/root-ca/mobileconfig
            media_type: application/x-apple-aspen-config
          steps:
            - {key: tls.install.ios.download, params: {}}
            - {key: tls.install.ios.install-profile, params: {}}
            - {key: tls.install.ios.trust-settings, params: {name: care-pi care.local Root CA}}
          notes: []
    PublicTlsRequest:
      x-phase: 6
      type: object
      additionalProperties: false
      description: The public certificate mode (Phase 6).
      required: [enabled, clinic_id]
      properties:
        enabled:
          type: boolean
          description: Turn the mode on or off.
        clinic_id:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
          description: The clinic id. Required when `enabled` is `true`.
          examples: [sunrise]
      examples:
        - enabled: true
          clinic_id: sunrise
    TailscaleRequest:
      x-phase: 6
      type: object
      additionalProperties: false
      description: The Tailscale mode (Phase 6).
      required: [enabled, auth_key]
      properties:
        enabled:
          type: boolean
          description: Turn the mode on or off.
        auth_key:
          type: [string, 'null']
          format: password
          writeOnly: true
          description: A Tailscale auth key. `null` gives a login URL in the job events. The agent deletes the key after the enrolment.
          examples: [tskey-auth-EXAMPLE]
      examples:
        - enabled: true
          auth_key: null
    FeStatus:
      type: object
      additionalProperties: false
      description: The FE build state (`care-pi fe status`).
      required: [provider, build_id, care_fe_sha, current, last_build, builds, scale_down_left, building]
      properties:
        provider:
          type: string
          enum: [none, artifact, local]
          description: '`fe.provider`.'
        build_id:
          type: [string, 'null']
          description: The FE build id of the lock.
          examples: [8d2f0c1a9b7e]
        care_fe_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'
          description: The care_fe sha of the lock.
          examples: [83b007b72cd0e5b1f2a3c4d5e6f708192a3b4c5d]
        current:
          type: [string, 'null']
          description: The target of `fe/current`.
          examples: [8d2f0c1a9b7e]
        last_build:
          description: The `fe` record of the lock. `null` before the first build.
          oneOf:
            - $ref: '#/components/schemas/FeLastBuild'
            - type: 'null'
        builds:
          type: array
          description: The builds in `/var/lib/care-pi/fe`.
          items:
            $ref: '#/components/schemas/FeBuild'
        scale_down_left:
          type: boolean
          description: The scale-down drop-in exists. With no FE build that runs, run an apply.
        building:
          type: boolean
          description: An FE build runs now.
      examples:
        - provider: local
          build_id: 8d2f0c1a9b7e
          care_fe_sha: 83b007b72cd0e5b1f2a3c4d5e6f708192a3b4c5d
          current: 8d2f0c1a9b7e
          last_build: {provider: local, built_at: '2026-10-30T10:20:00Z', duration: 1m1s, url: null, sha256: null}
          builds:
            - {id: 8d2f0c1a9b7e, bytes: 13107200, modified_at: '2026-10-30T10:20:00Z', current: true}
          scale_down_left: false
          building: false
    FeLastBuild:
      type: object
      additionalProperties: false
      description: The `fe` record of `lock.yaml`.
      required: [provider, built_at, duration, url, sha256]
      properties:
        provider:
          type: string
          enum: [artifact, local]
          description: The provider of the build.
        built_at:
          type: [string, 'null']
          description: The end of a local build.
        duration:
          type: [string, 'null']
          description: The time of a local build, as a Go duration.
          examples: [1m1s]
        url:
          type: [string, 'null']
          description: The bundle URL of the artifact provider.
        sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: The SHA-256 of the bundle.
      examples:
        - provider: local
          built_at: '2026-10-30T10:20:00Z'
          duration: 1m1s
          url: null
          sha256: null
    FeBuild:
      type: object
      additionalProperties: false
      description: One FE build on disk.
      required: [id, bytes, modified_at, current]
      properties:
        id:
          type: string
          description: The build id.
          examples: [8d2f0c1a9b7e]
        bytes:
          type: integer
          minimum: 0
          description: The size of the build.
        modified_at:
          type: string
          format: date-time
          description: The time of the build directory.
