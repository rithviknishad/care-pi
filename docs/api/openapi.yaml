          commit: 1f2e3d4c5b6a79881f2e3d4c5b6a79881f2e3d4c
          date: '2026-10-30T08:00:00Z'
          dev_build: false
          started_at: '2026-10-30T09:00:00Z'
    HostStatus:
      type: object
      additionalProperties: false
      description: The host resources, from `/proc`. No exporter is necessary (`01` §13).
      required: [model, arch, kernel, os, page_size_bytes, cpu_count, load_average, uptime_s, memory]
      properties:
        model:
          type: [string, 'null']
          description: The board model.
          examples: [Raspberry Pi 5 Model B Rev 1.0]
        arch:
          type: string
          enum: [arm64, amd64]
          description: The CPU architecture.
        kernel:
          type: string
          description: The kernel release.
          examples: [6.18.0-v8-16k+]
        os:
          type: string
          description: '`PRETTY_NAME` of `/etc/os-release`.'
          examples: [Debian GNU/Linux 13 (trixie)]
        page_size_bytes:
          type: integer
          description: The kernel page size.
          examples: [16384]
        cpu_count:
          type: integer
          minimum: 1
          description: The number of CPUs.
          examples: [4]
        load_average:
          type: array
          minItems: 3
          maxItems: 3
          description: The load average for 1, 5, and 15 minutes.
          items:
            type: number
            minimum: 0
          examples: [[0.42, 0.37, 0.3]]
        uptime_s:
          type: integer
          minimum: 0
          description: The time since boot.
          examples: [86400]
        memory:
