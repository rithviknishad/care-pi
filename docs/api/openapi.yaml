    get:
      tags: [config]
      operationId: getConfigSchema
      summary: Get the JSON Schema of config.yaml
      description: The console makes its forms from this schema (draft 2020-12). It is the file `agent/internal/config/schema/config.schema.json`.
      x-cli: care-pi config schema
