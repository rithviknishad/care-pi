  /logs/{unit}:
    get:
      tags: [logs]
      operationId: getLogs
      summary: Read or follow the journal of a unit
      description: |
        The agent runs `journalctl` for the unit.

        - `application/json`: the last `n` lines (or the lines after the cursor `after`), oldest first.
        - `text/event-stream` with `follow=true`: the last `n` lines, then each new line. The event id is the journal cursor.
          After a reconnect with `Last-Event-ID`, the stream continues after that cursor. A `heartbeat` event comes every 15 s.
      x-cli: care-pi logs UNIT [-n N] [--since TIME] [-f] [--json]
      x-problems: [not-authenticated, unit-not-found, invalid-request]
      parameters:
        - $ref: '#/components/parameters/LogUnitPath'
        - name: n
          in: query
          description: The number of lines.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
        - name: since
          in: query
          description: Only lines at or after this time.
          schema:
            type: string
            format: date-time
        - name: after
          in: query
          description: Only lines after this journal cursor (`next_cursor` of the previous page).
          schema:
            $ref: '#/components/schemas/JournalCursor'
        - name: follow
          in: query
          description: Keep the stream open and send new lines. Only with the `Accept` header `text/event-stream`.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LastEventIdCursor'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventStream'
              examples:
                follow:
                  summary: Two lines and a heartbeat
                  value: |
                    retry: 3000

                    id: s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f
                    event: log
                    data: {"time":"2026-10-30T10:15:00Z","cursor":"s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f","priority":6,"unit":"care-api.service","message":"Booting worker with pid: 12"}

                    event: heartbeat
                    data: {"time":"2026-10-30T10:15:15Z"}

        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
