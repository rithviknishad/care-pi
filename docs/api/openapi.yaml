    Plug:
      x-phase: 4
      type: object
      additionalProperties: false
      description: One plug of the solution (`03` §1).
      required: [id, kind, enabled, auto, repo, ref, sha, custom, settings]
      properties:
        id:
          type: string
          description: The plug id.
          examples: [care_onboarding_fe]
        kind:
          type: string
          enum: [backend, frontend]
          description: The kind of plug.
        enabled:
          type: boolean
          description: The plug is on.
        auto:
          type: [string, 'null']
          enum: [when_multihost, null]
          description: The agent turns the plug on by a rule.
        repo:
          type: string
          format: uri
          description: The source repository.
        ref:
          type: string
          description: The tracked or pinned ref.
          examples: [main]
        sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'
          description: The sha of the lock.
        custom:
          type: boolean
          description: The operator changed the plug (unsupported).
        settings:
          type: object
          description: The values of the settings form of the plug.
      examples:
        - id: care_onboarding_fe
          kind: frontend
          enabled: true
          auto: null
          repo: https://github.com/ohcnetwork/care_onboarding_fe
          ref: main
          sha: 0123456789abcdef0123456789abcdef01234567
          custom: false
          settings: {}
    PlugList:
      x-phase: 4
      type: object
      additionalProperties: false
      description: The plugs of the solution.
      required: [items]
      properties:
        items:
          type: array
          description: The plugs.
          items:
            $ref: '#/components/schemas/Plug'
      examples:
        - items: []
    PlugChange:
      x-phase: 4
      type: object
      additionalProperties: false
      description: A change of one plug.
      properties:
        enabled:
          type: boolean
          description: Turn the plug on or off.
        settings:
          type: object
          description: New values for the settings form.
      examples:
        - enabled: false
    BackupsHealth:
      type: object
      additionalProperties: false
      description: |
        The backup banners of the dashboard (`02` §7). `state` is the worst `severity` of the banners, or `ok` without a banner.
        Design note section 13.10 gives the rule of each code.
      required: [state, banners, generated_at]
      properties:
        state:
          type: string
          enum: [ok, info, warning, error]
          description: The worst severity of `banners`. `ok` when the list is empty.
        banners:
          type: array
          description: The banners, the worst first.
          items:
            $ref: '#/components/schemas/BackupBanner'
        generated_at:
          type: string
          format: date-time
          description: The time of this report.
      examples:
        - state: error
          banners:
            - {code: destination-unreachable, severity: error, destination_id: b2, since: '2026-10-29T08:45:00Z', message: b2 has no successful snapshot for 26 hours}
            - {code: recovery-key-unconfirmed, severity: warning, destination_id: null, since: '2026-10-30T10:06:00Z', message: the recovery key is not confirmed}
          generated_at: '2026-10-30T10:55:30Z'
    BackupBanner:
      type: object
      additionalProperties: false
      description: One banner. The console shows its own text for `code`.
      required: [code, severity, destination_id, since, message]
      properties:
        code:
          type: string
          enum: [no-destination, no-recovery-key, recovery-key-unconfirmed, destination-unreachable, destination-low-space, local-disk-low, local-backup-failed, wal-archive-failing, verify-failed, drill-failed, backups-paused, local-repository-legacy-key]
          description: The condition (design note section 13.10). A later version can add codes.
        severity:
          type: string
          enum: [info, warning, error]
          description: '`error`: the backups do not protect the data now. `warning`: act soon. `info`: advice.'
        destination_id:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination of the banner. `null` for a banner of the whole host.
        since:
          type: [string, 'null']
          format: date-time
          description: The start of the condition, when it is known.
        message:
          type: string
          description: A short English text.
      examples:
        - code: destination-unreachable
          severity: error
          destination_id: b2
          since: '2026-10-29T08:45:00Z'
          message: b2 has no successful snapshot for 26 hours
    ScheduleEntry:
      type: object
      additionalProperties: false
      description: One backup timer, from `config.yaml` and systemd.
      required: [id, kind, destination_id, unit, calendar, interval_min, enabled, next_run_at, last_run_at, last_ok]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z-]*(:[a-z0-9][a-z0-9-]{0,30})?$'
          description: A stable id. `<kind>` for a local timer, `db:<destination id>` and `files:<destination id>` for a destination.
          examples: ['db:usb']
        kind:
          type: string
          enum: [db-full, db-incr, verify, drill, snapshot-db, snapshot-files]
          description: The work of the timer. A later version can add kinds.
        destination_id:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination of a snapshot timer. `null` for a local timer.
        unit:
          type: string
          pattern: '^care-backup-[a-z-]+(@[a-z0-9][a-z0-9-]{0,30})?\.timer$'
          description: The systemd timer. `GET /logs/backup` has the journal of its service.
          examples: [care-backup-db-full.timer]
        calendar:
          type: [string, 'null']
          description: The systemd calendar text of the timer (`backups.schedule.*`). `null` for an interval timer.
          examples: ['Sun 01:00']
        interval_min:
          type: [integer, 'null']
          minimum: 1
          description: The interval of a `snapshot-db` timer (`interval_min` of the destination). `null` for a calendar timer.
        enabled:
          type: boolean
          description: The timer runs. `false` when `backups.paused` is `true`, and for `drill` when `backups.drill_enabled` is `false`.
        next_run_at:
          type: [string, 'null']
          format: date-time
          description: The next run. `null` when the timer does not run.
        last_run_at:
          type: [string, 'null']
          format: date-time
          description: The start of the last run.
        last_ok:
          type: [boolean, 'null']
          description: The last run succeeded. `null` before the first run.
      examples:
        - id: db-full
          kind: db-full
          destination_id: null
          unit: care-backup-db-full.timer
          calendar: 'Sun 01:00'
          interval_min: null
          enabled: true
          next_run_at: '2026-11-01T01:00:00Z'
          last_run_at: '2026-10-26T01:00:00Z'
          last_ok: true
    LocalBackup:
      type: object
      additionalProperties: false
      description: One backup of the local pgBackRest repository (`pgbackrest info`).
      required: [label, type, started_at, finished_at, size_bytes, repo_size_bytes, reason]
      properties:
        label:
          $ref: '#/components/schemas/BackupLabel'
        type:
          type: string
          enum: [full, diff, incr]
          description: The pgBackRest backup type.
        started_at:
          type: string
          format: date-time
          description: The start of the backup.
        finished_at:
          type: string
          format: date-time
          description: The end of the backup. A restore of this backup gives the data of this time.
        size_bytes:
          type: integer
          minimum: 0
          description: The size of the database.
        repo_size_bytes:
          type: integer
          minimum: 0
          description: The size of this backup in the repository (compressed, without the earlier backups).
        reason:
          type: [string, 'null']
          description: The annotation `care-pi-reason` (the `reason` of "Back up now", or of the job that made the backup).
      examples:
        - label: 20261026-010002F_20261030-020003I
          type: incr
          started_at: '2026-10-30T02:00:03Z'
          finished_at: '2026-10-30T02:00:08Z'
          size_bytes: 48500000
          repo_size_bytes: 26000
          reason: null
    BackupLabel:
      type: string
      pattern: '^[0-9]{8}-[0-9]{6}F(_[0-9]{8}-[0-9]{6}[DI])?$'
      description: A pgBackRest backup label. `F` is a full backup. `_…D` and `_…I` are a differential and an incremental backup on that full backup.
      examples: [20261026-010002F_20261030-104705I]
    Checkpoint:
      type: object
      additionalProperties: false
      description: |
        A checkpoint (design note section 13.11): a local backup that a job made before it changed the database.
        A restore of the checkpoint (`POST /restore`, `kind: pitr`, `checkpoint`) gives the data at `undo_point`.
      required: [label, undo_point, timeline, job_id, job_kind, reason]
      properties:
        label:
          $ref: '#/components/schemas/BackupLabel'
        undo_point:
          type: string
          format: date-time
          description: The end of the checkpoint backup. The application was stopped, so no write came after it.
        timeline:
          type: integer
          minimum: 1
          description: The timeline of the checkpoint.
        job_id:
          description: The job that made the checkpoint. `null` for a checkpoint of `POST /backups/run`.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
        job_kind:
          description: The kind of that job (`restore-pitr`; in Phase 4 also `update`). `null` with `job_id` `null`.
          oneOf:
            - $ref: '#/components/schemas/JobKind'
            - type: 'null'
        reason:
          type: [string, 'null']
          description: The reason of the job.
      examples:
        - label: 20261026-010002F_20261030-104705I
          undo_point: '2026-10-30T10:47:10Z'
          timeline: 1
          job_id: 20261030T104700.000Z-restore-pitr
          job_kind: restore-pitr
          reason: undo the import of 09:42
    SnapshotInfo:
      type: object
      additionalProperties: false
      description: One restic snapshot of a destination.
      required: [destination, snapshot_id, time, contents, size_bytes, hostname, key_id]
      properties:
        destination:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination id. `null` in a `DrInspection` (the device has no config yet).
          examples: [usb]
        snapshot_id:
          type: string
          pattern: '^[0-9a-f]{8,64}$'
          description: The restic snapshot id (the short form of 8 hex digits is enough).
          examples: [4f1e9a2c]
        time:
          type: string
          format: date-time
          description: The time of the snapshot.
        contents:
          type: array
          description: '`db`: the local pgBackRest repository. `files`: `/var/lib/care-pi/s3`. `config`: `/etc/care-pi` (each snapshot has it).'
          items:
            type: string
            enum: [db, files, config]
        size_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The size of the data of the snapshot (the restic summary). `null` when restic does not tell it.
        hostname:
          type: string
          description: The host name of the device that made the snapshot.
          examples: [care]
        key_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: The key id of the repository.
          examples: [1a2b3c4d]
      examples:
        - destination: usb
          snapshot_id: 4f1e9a2c
          time: '2026-10-30T10:45:00Z'
          contents: [db, config]
          size_bytes: 52428800
          hostname: care
          key_id: 1a2b3c4d
    SnapshotListing:
      type: object
      additionalProperties: false
      description: When the agent listed the snapshots of one destination, and the result.
      required: [id, listed_at, ok, error, snapshot_count]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination id.
        listed_at:
          type: [string, 'null']
          format: date-time
          description: The time of the last list. `null` before the first list.
        ok:
          type: [boolean, 'null']
          description: The last list succeeded. `null` before the first list.
        error:
          type: [string, 'null']
          description: The error of the last list.
        snapshot_count:
          type: [integer, 'null']
          minimum: 0
          description: The snapshots of the last list.
      examples:
        - id: usb
          listed_at: '2026-10-30T10:45:40Z'
          ok: true
          error: null
          snapshot_count: 412
    VerifyOutcome:
      type: object
      additionalProperties: false
      description: The result of one verify of the local repository or of one destination.
      required: [job_id, finished_at, ok, detail]
      properties:
        job_id:
          description: The `backup-verify` job.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
        finished_at:
          type: string
          format: date-time
          description: The end of the verify.
        ok:
          type: boolean
          description: The verify found no error.
        detail:
          type: [string, 'null']
          description: The first error. `null` when `ok` is `true`.
      examples:
        - job_id: 20261026T030000.000Z-backup-verify
          finished_at: '2026-10-26T03:00:40Z'
          ok: true
          detail: null
    VerifyState:
      type: object
      additionalProperties: false
      description: The verify timer and the last verify job.
      required: [schedule, next_run_at, last]
      properties:
        schedule:
          type: string
          description: '`backups.schedule.verify`.'
          examples: ['Sat 03:00']
        next_run_at:
          type: [string, 'null']
          format: date-time
          description: The next run. `null` when the timers are off.
        last:
          description: The last `backup-verify` job (each part). `null` before the first verify.
          oneOf:
            - $ref: '#/components/schemas/VerifyOutcome'
            - type: 'null'
      examples:
        - schedule: 'Sat 03:00'
          next_run_at: '2026-10-31T03:00:00Z'
          last: null
    DrillState:
      type: object
      additionalProperties: false
      description: The restore drill (`02` §4).
      required: [enabled, schedule, next_run_at, last]
      properties:
        enabled:
          type: boolean
          description: '`backups.drill_enabled`.'
        schedule:
          type: string
          description: '`backups.schedule.drill`.'
          examples: ['*-*-01 04:00']
        next_run_at:
          type: [string, 'null']
          format: date-time
          description: The next run. `null` when the drill is off.
        last:
          description: The last drill. `null` before the first drill.
          oneOf:
            - $ref: '#/components/schemas/DrillOutcome'
            - type: 'null'
      examples:
        - enabled: true
          schedule: '*-*-01 04:00'
          next_run_at: '2026-11-01T04:00:00Z'
          last: {job_id: 20261001T040000.000Z-restore-drill, finished_at: '2026-10-01T04:00:21Z', outcome: passed, duration_s: 21.4, detail: null}
    DrillOutcome:
      type: object
      additionalProperties: false
      description: The result of one restore drill. The agent keeps the last 12.
      required: [job_id, finished_at, outcome, duration_s, detail]
      properties:
        job_id:
          description: The `restore-drill` job.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
        finished_at:
          type: string
          format: date-time
          description: The end of the drill.
        outcome:
          type: string
          enum: [passed, failed, skipped]
          description: '`skipped`: the free disk space was less than 2 times the database size.'
        duration_s:
          type: [number, 'null']
          minimum: 0
          description: The time of the drill.
        detail:
          type: [string, 'null']
          description: Why the drill failed or was skipped.
      examples:
        - job_id: 20261001T040000.000Z-restore-drill
          finished_at: '2026-10-01T04:00:21Z'
          outcome: passed
          duration_s: 21.4
          detail: null
    HostKey:
      type: object
      additionalProperties: false
      description: The host key that an SFTP server presents (TOFU, SP6 finding 2).
      required: [type, fingerprint_sha256, public_key, trusted]
      properties:
        type:
          type: string
          enum: [ssh-ed25519, ecdsa-sha2-nistp256, ecdsa-sha2-nistp384, ecdsa-sha2-nistp521, ssh-rsa]
          description: The key type. The agent pins one key and allows only its type.
        fingerprint_sha256:
          type: string
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: The fingerprint as `ssh-keygen -lf` prints it. The operator compares it with the server.
          examples: ['SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s']
        public_key:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/host_key'
          description: The key as `host_key` of the destination in `config.yaml` needs it.
        trusted:
          type: boolean
          description: The key is the pinned key, or the `accept_fingerprint` of the request.
      examples:
        - type: ecdsa-sha2-nistp256
          fingerprint_sha256: 'SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s'
          public_key: ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEXAMPLEEXAMPLEEXAMPLE=
          trusted: false
    SshPublicKey:
      type: object
      additionalProperties: false
      description: The SSH public key of the agent for `sftp` destinations. It comes from the recovery key (design note section 13.3).
      required: [key, key_id, type, public_key, authorized_keys_line, fingerprint_sha256]
      properties:
        key:
          type: string
          enum: [active, pending]
          description: The recovery key that the SSH key comes from.
        key_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: The key id of that recovery key.
          examples: [1a2b3c4d]
        type:
          type: string
          const: ssh-ed25519
          description: The key type. restic uses the OpenSSH client of the host, so ed25519 works (SP6 used libssh2 of pgBackRest).
        public_key:
          type: string
          pattern: '^ssh-ed25519 [A-Za-z0-9+/]+={0,2} care-pi@[a-z0-9-]+$'
          description: The public key with the comment `care-pi@<hostname>-<key id>`.
          examples: [ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE care-pi@care-1a2b3c4d]
        authorized_keys_line:
          type: string
          description: The line for `~/.ssh/authorized_keys`. `restrict` turns off the forwardings and the terminal; SFTP still works.
          examples: [restrict ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE care-pi@care-1a2b3c4d]
        fingerprint_sha256:
          type: string
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: The fingerprint of the key.
      examples:
        - key: active
          key_id: 1a2b3c4d
          type: ssh-ed25519
          public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE care-pi@care-1a2b3c4d
          authorized_keys_line: restrict ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE care-pi@care-1a2b3c4d
          fingerprint_sha256: 'SHA256:Wm1ZQ0vV2xYqk3p7mN8tR4sL6uH9jF0dE5cB2aG1iKo'
    DestinationRun:
      type: object
      additionalProperties: false
      description: One run of a destination timer or job.
      required: [started_at, finished_at, kind, source, ok, snapshot_id, added_bytes, error_code, error, job_id]
      properties:
        started_at:
          type: string
          format: date-time
          description: The start of the run.
        finished_at:
          type: [string, 'null']
          format: date-time
          description: The end of the run. `null` while it runs.
        kind:
          type: string
          enum: [init, db, files, forget, prune, check]
          description: '`init`: `restic init`. `db`, `files`: a snapshot. `forget`, `prune`, `check`: the retention and the verify.'
        source:
          type: string
          enum: [timer, console, cli]
          description: What started the run.
        ok:
          type: [boolean, 'null']
          description: The run succeeded. `null` while it runs.
        snapshot_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8,64}$'
          description: The new snapshot of a `db` or `files` run.
        added_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The bytes that the run added to the repository (after deduplication and compression).
        error_code:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: A problem slug or a check name, for a failed run.
        error:
          type: [string, 'null']
          description: The error of a failed run.
        job_id:
          description: The job of a run of the console or the CLI. `null` for a timer run of a snapshot.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
      examples:
        - started_at: '2026-10-30T10:45:00Z'
          finished_at: '2026-10-30T10:45:04Z'
          kind: db
          source: timer
          ok: true
          snapshot_id: 4f1e9a2c
          added_bytes: 1048576
          error_code: null
          error: null
          job_id: null
    DestinationList:
      type: object
      additionalProperties: false
      description: The destinations of `config.yaml` with their state.
      required: [items]
      properties:
        items:
          type: array
          description: In the order of `backups.destinations`.
          items:
            $ref: '#/components/schemas/DestinationState'
      examples:
        - items: []
    DestinationSecretsState:
      type: object
      additionalProperties: false
      description: The stored secret of a destination, without the secret.
      required: [id, type, present, access_key_id_hint, updated_at]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination id.
          examples: [b2]
        type:
          type: string
          const: s3
          description: Only an `s3` destination has a secret.
        present:
          type: boolean
          description: The agent has the secret.
        access_key_id_hint:
          type: [string, 'null']
          description: The first 4 and the last 4 characters of the access key id, for the operator to recognize it.
          examples: [AKIA…MPLE]
        updated_at:
          type: [string, 'null']
          format: date-time
          description: The last change of the secret.
      examples:
        - id: b2
          type: s3
          present: true
          access_key_id_hint: AKIA…MPLE
          updated_at: '2026-10-30T10:07:00Z'
    BackupDisk:
      type: object
      additionalProperties: false
      description: One block device of the host, for the choice "USB disk".
      required: [id, device, model, serial, size_bytes, transport, removable, usage, mounted, partitions, care_label, destination_id]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
          description: The name in `/dev/disk/by-id/`. It stays the same when the disk moves to another port.
          examples: ['usb-SanDisk_Extreme_55AE_323130364E-0:0']
        device:
          type: string
          pattern: '^/dev/[a-z0-9]+$'
          description: The device now. It can change at the next connection.
          examples: [/dev/sdb]
        model:
          type: [string, 'null']
          description: The model, when the disk tells it.
          examples: [SanDisk Extreme 55AE]
        serial:
          type: [string, 'null']
          description: The serial number, when the disk tells it.
        size_bytes:
          type: integer
          minimum: 0
          description: The size of the disk.
        transport:
          type: string
          enum: [usb, nvme, sata, sd, virtio, other]
          description: The bus of the disk.
        removable:
          type: boolean
          description: The kernel marks the disk as removable.
        usage:
          type: string
          enum: [system, care-backup, empty, other-data]
          description: |
            `system`: the disk holds `/`, `/boot`, or swap. The agent never prepares it. `care-backup`: a partition has a care-pi label.
            `empty`: no partition table or no file system. `other-data`: other file systems; a prepare erases them.
        mounted:
          type: boolean
          description: A partition of the disk is mounted now (also by care-pi).
        partitions:
          type: array
          description: The partitions.
          items:
            $ref: '#/components/schemas/BackupDiskPartition'
        care_label:
          type: [string, 'null']
          pattern: '^care-[a-z0-9][a-z0-9-]{0,10}$'
          description: The label of the care-pi file system of the disk. Use it as `disk_label`.
        destination_id:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination of `config.yaml` with `disk_label` equal to `care_label`.
      examples:
        - id: 'usb-SanDisk_Extreme_55AE_323130364E-0:0'
          device: /dev/sdb
          model: SanDisk Extreme 55AE
          serial: 323130364E
          size_bytes: 500107862016
          transport: usb
          removable: false
          usage: other-data
          mounted: false
          partitions:
            - {device: /dev/sdb1, size_bytes: 500105764864, fs_type: exfat, label: SANDISK, mount: null}
          care_label: null
          destination_id: null
    BackupDiskPartition:
      type: object
      additionalProperties: false
      description: One partition of a disk.
      required: [device, size_bytes, fs_type, label, mount]
      properties:
        device:
          type: string
          pattern: '^/dev/[a-z0-9]+$'
          description: The partition device.
          examples: [/dev/sdb1]
        size_bytes:
          type: integer
          minimum: 0
          description: The size of the partition.
        fs_type:
          type: [string, 'null']
          description: The file system type, when one exists.
          examples: [ext4]
        label:
          type: [string, 'null']
          description: The file system label.
          examples: [care-usb1]
        mount:
          type: [string, 'null']
          description: The mount point now. `null` when it is not mounted.
          examples: [/var/lib/care-pi/disks/care-usb1]
      examples:
        - device: /dev/sdb1
          size_bytes: 500105764864
          fs_type: ext4
          label: care-usb1
          mount: /var/lib/care-pi/disks/care-usb1
    BackupDiskList:
      type: object
      additionalProperties: false
      description: The block devices of the host.
      required: [items, generated_at]
      properties:
        items:
          type: array
          description: The disks, `system` first.
          items:
            $ref: '#/components/schemas/BackupDisk'
        generated_at:
          type: string
          format: date-time
          description: The time of the list.
      examples:
        - items: []
          generated_at: '2026-10-30T10:06:30Z'
    DiskPrepareRequest:
      type: object
      additionalProperties: false
      description: The confirmation and the label for a disk prepare.
      required: [wipe]
      properties:
        wipe:
          type: boolean
          const: true
          description: Always `true`. The operator agreed that the job erases the disk.
        label:
          type: [string, 'null']
          pattern: '^care-[a-z0-9][a-z0-9-]{0,10}$'
          description: 'The file system label (ext4 allows 16 bytes). `null`: the agent chooses `care-usb<N>`.'
          examples: [care-usb1]
      examples:
        - wipe: true
          label: care-usb1
    RecoveryKeyStatus:
      type: object
      additionalProperties: false
      description: The state of the recovery key, without a secret (`02` §2).
      required: [state, key_id, created_at, confirmed_at, confirm_positions, pending, local_repository, rotation_job_id]
      properties:
        state:
          type: string
          enum: [none, unconfirmed, confirmed]
          description: '`none`: no key. `unconfirmed`: the operator did not type the 3 words yet; the console shows a banner. `confirmed`.'
        key_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8}$'
          description: The key id of the active key. `null` without a key.
        created_at:
          type: [string, 'null']
          format: date-time
          description: The creation of the active key.
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: The confirmation of the active key.
        confirm_positions:
          type: [array, 'null']
          minItems: 3
          maxItems: 3
          description: The 3 positions (1 to 24) that the confirmation asks for, in order. `null` when the state is not `unconfirmed`.
          items:
            type: integer
            minimum: 1
            maximum: 24
        pending:
          type: [object, 'null']
          additionalProperties: false
          description: The new key of a rotation (`POST /backups/recovery-key` when a key exists). `null` without one.
          required: [key_id, created_at, confirmed_at, confirm_positions]
          properties:
            key_id:
              type: string
              pattern: '^[0-9a-f]{8}$'
              description: The key id of the pending key.
            created_at:
              type: string
              format: date-time
              description: The creation of the pending key.
            confirmed_at:
              type: [string, 'null']
              format: date-time
              description: The confirmation of the pending key. The rotation needs it.
            confirm_positions:
              type: [array, 'null']
              minItems: 3
              maxItems: 3
              description: The 3 positions that the confirmation of the pending key asks for. `null` after the confirmation.
              items:
                type: integer
                minimum: 1
                maximum: 24
        local_repository:
          type: string
          enum: [derived, legacy, none]
          description: 'The cipher pass of the local repository. `legacy`: a random pass of Phase 1 or Phase 2 (design note section 13.12). `none`: no repository yet.'
        rotation_job_id:
          description: The last `recovery-key-rotate` job. `null` before the first rotation.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
      examples:
        - state: unconfirmed
          key_id: 1a2b3c4d
          created_at: '2026-10-30T10:06:00Z'
          confirmed_at: null
          confirm_positions: [3, 11, 20]
          pending: null
          local_repository: none
          rotation_job_id: null
    RecoveryKeyCreated:
      type: object
      additionalProperties: false
      description: The new recovery key (one time) and the key state.
      required: [key, status]
      properties:
        key:
          $ref: '#/components/schemas/RecoveryKey'
        status:
          $ref: '#/components/schemas/RecoveryKeyStatus'
      examples:
        - key:
            words: [abandon, ability, able, about, above, absent, absorb, abstract, absurd, abuse, access, accident, account, accuse, achieve, acid, acoustic, acquire, across, act, action, actor, actress, actual]
            created_at: '2026-10-30T10:06:00Z'
            key: active
            key_id: 1a2b3c4d
            qr_payload: CARE-PI-RK1:ABANDON ABILITY ABLE ABOUT ABOVE ABSENT ABSORB ABSTRACT ABSURD ABUSE ACCESS ACCIDENT ACCOUNT ACCUSE ACHIEVE ACID ACOUSTIC ACQUIRE ACROSS ACT ACTION ACTOR ACTRESS ACTUAL
            file_name: care-recovery-sunrise-clinic.txt
          status:
            state: unconfirmed
            key_id: 1a2b3c4d
            created_at: '2026-10-30T10:06:00Z'
            confirmed_at: null
            confirm_positions: [3, 11, 20]
            pending: null
            local_repository: none
            rotation_job_id: null
    RecoveryKeyConfirmRequest:
      type: object
      additionalProperties: false
      description: The 3 words at the `confirm_positions` of the active or the pending key.
      required: [words]
      properties:
        key:
          type: string
          enum: [active, pending]
          default: active
          description: The key to confirm.
        words:
          type: array
          minItems: 3
          maxItems: 3
          description: The words at the 3 `confirm_positions`, in order.
          items:
            $ref: '#/components/schemas/RecoveryKeyWord'
      examples:
        - key: active
          words:
            - {index: 3, word: able}
            - {index: 11, word: acce}
            - {index: 20, word: act}
    RecoveryKeyRotateRequest:
      type: object
      additionalProperties: false
      description: 'The options of a rotation. An empty body is `new_key: true`, `remove_old_repositories: true`.'
      properties:
        new_key:
          type: boolean
          default: true
          description: '`true`: use the confirmed pending key. `false`: keep the key; re-key only a `legacy` local repository.'
        remove_old_repositories:
          type: boolean
          default: true
          description: Delete the old repositories after the first snapshot to each destination.
        reason:
          type: [string, 'null']
          maxLength: 200
          description: A text for the job journal.
          examples: [the old sheet is lost]
      examples:
        - new_key: false
          remove_old_repositories: true
          reason: re-key the local repository of Phase 2
    RecoveryKeyInput:
      type: object
      additionalProperties: false
      description: |
        A recovery key that the operator types, pastes from the `.txt` file, or scans from the QR code. The console splits it into words.
        The agent accepts the first 4 letters of each word and checks the BIP-39 checksum (`invalid-request`, code `checksum`).
      required: [words]
      properties:
        words:
          type: array
          minItems: 24
          maxItems: 24
          description: The 24 words in order, in lowercase letters.
          items:
            type: string
            pattern: '^[a-z]{3,8}$'
      examples:
        - words: [abandon, ability, able, about, above, absent, absorb, abstract, absurd, abuse, access, accident, account, accuse, achieve, acid, acoustic, acquire, across, act, action, actor, actress, actual]
    RecoveryKeyText:
      type: string
      description: The text file of the recovery key (UTF-8, LF line ends). It has the clinic name, the key id, the date, the 24 numbered words, and the instructions.
      examples:
        - |
          care-pi recovery key
          Clinic: Sunrise Clinic
          Key id: 1a2b3c4d
          Made: 2026-10-30

           1 abandon    9 absurd    17 acoustic
           2 ability   10 abuse     18 acquire
           3 able      11 access    19 across
           4 about     12 accident  20 act
           5 above     13 account   21 action
           6 absent    14 accuse    22 actor
           7 absorb    15 achieve   23 actress
           8 abstract  16 acid      24 actual

          Keep this sheet in a safe place, away from the device.
          You need it to restore the backups on a new device.
    BackupVerifyRequest:
      type: object
      additionalProperties: false
      description: 'The options of "Verify now". An empty body is `scope: all` with a 5 % sample.'
      properties:
        scope:
          type: string
          enum: [all, local-db, destination]
          description: '`all`: the local repository and each destination. Default: `destination` when `destination` is set, else `all`.'
        destination:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: 'The destination for `scope: destination`.'
        read_data_subset_pct:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
          description: The percent of the data that `restic check --read-data-subset` reads back.
        prune:
          type: boolean
          default: false
          description: Run `restic forget` with the retention and `restic prune` before the check.
      examples:
        - scope: destination
          destination: nas
          read_data_subset_pct: 10
          prune: false
    RestoreDrillRequest:
      type: object
      additionalProperties: false
      description: The options of "Test restore".
      properties:
        reason:
          type: [string, 'null']
          maxLength: 200
          description: A text for the job journal.
          examples: [check after the disk change]
      examples:
        - reason: null
    RestorePitrRequest:
      type: object
      additionalProperties: false
      description: |
        A point-in-time restore on this device (`02` §6). Exactly one of `time` and `checkpoint` is a string.
        `time` follows the newest timeline that contains the time. `checkpoint` restores the end of that checkpoint
        (`pgbackrest restore --set=<label> --type=immediate`), on its timeline: use it to undo a restore.
      required: [kind]
      properties:
        kind:
          type: string
          const: pitr
          description: The variant.
        time:
          type: [string, 'null']
          format: date-time
          description: The point in time. It must be inside the restore window (`GET /restore/points`).
        checkpoint:
          oneOf:
            - $ref: '#/components/schemas/BackupLabel'
            - type: 'null'
          description: The label of a checkpoint (`RestorePoints.checkpoints`).
        reason:
          type: [string, 'null']
          maxLength: 200
          description: A text for the job journal and the annotation of the checkpoint.
      oneOf:
        - required: [time]
          properties:
            time:
              type: string
        - required: [checkpoint]
          properties:
            checkpoint:
              type: string
      examples:
        - kind: pitr
          time: '2026-10-30T09:40:00Z'
          checkpoint: null
          reason: undo the import of 09:42
    RestoreFilesRequest:
      type: object
      additionalProperties: false
      description: A restore of files from one restic snapshot (`02` §6). The database does not change.
      required: [kind, destination, snapshot_id]
      properties:
        kind:
          type: string
          const: files
          description: The variant.
        destination:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination of the snapshot.
          examples: [usb]
        snapshot_id:
          type: string
          pattern: '^[0-9a-f]{8,64}$'
          description: A snapshot with `files` in `contents`.
          examples: [1a2b3c4d]
        paths:
          type: [array, 'null']
          minItems: 1
          maxItems: 100
          description: 'Files or directories below `/var/lib/care-pi/s3` (the first part is the bucket). `null`: each file of the snapshot.'
          items:
            type: string
            maxLength: 1024
            pattern: '^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*/?$'
          examples: [[patient-bucket/2026/10]]
        target:
          type: string
          enum: [in-place, side-dir]
          default: in-place
          description: '`in-place`: into `/var/lib/care-pi/s3` (the maintenance page is on). `side-dir`: into `/var/lib/care-pi/restore/<job id>/`.'
        reason:
          type: [string, 'null']
          maxLength: 200
          description: A text for the job journal.
      examples:
        - kind: files
          destination: usb
          snapshot_id: 1a2b3c4d
          paths: null
          target: in-place
          reason: the upload folder was deleted
    DrDestination:
      description: The one destination for a restore of this device. The same keys as a destination of `config.yaml`, with the secret. No `id`.
      oneOf:
        - $ref: '#/components/schemas/DrDestinationPosix'
        - $ref: '#/components/schemas/DrDestinationSftp'
        - $ref: '#/components/schemas/DrDestinationS3'
      discriminator:
        propertyName: type
        mapping:
          posix: '#/components/schemas/DrDestinationPosix'
          sftp: '#/components/schemas/DrDestinationSftp'
          s3: '#/components/schemas/DrDestinationS3'
      examples:
        - type: posix
          path: null
          disk_label: care-usb1
    DrDestinationPosix:
      type: object
      additionalProperties: false
      description: |
        A directory or a care-pi backup disk (`GET /backups/disks`, `usage: care-backup`). Exactly one of `path` and `disk_label` is a string.
        The agent mounts a disk read-only at `/var/lib/care-pi/disks/<label>` for the job.
      required: [type]
      properties:
        type:
          type: string
          const: posix
          description: The destination type.
        path:
          oneOf:
            - $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/path'
            - type: 'null'
          description: A directory that holds `care-pi-<key id>`.
        disk_label:
          oneOf:
            - $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/disk_label'
            - type: 'null'
          description: The label of a care-pi backup disk.
      oneOf:
        - required: [path]
          properties:
            path:
              type: string
        - required: [disk_label]
          properties:
            disk_label:
              type: string
      examples:
        - type: posix
          path: null
          disk_label: care-usb1
    DrDestinationSftp:
      type: object
      additionalProperties: false
      description: An SFTP server. The SSH key comes from the recovery key, so the server still accepts the device. `host_key` comes from the TOFU problem of the first call.
      required: [type, host, user, path]
      properties:
        type:
          type: string
          const: sftp
          description: The destination type.
        host:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/host'
          description: The server.
        port:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/port'
          description: The SSH port. Default 22.
        user:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/user'
          description: The user on the server.
        path:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/path'
          description: The directory that holds `care-pi-<key id>`.
        host_key:
          oneOf:
            - $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/host_key'
            - type: 'null'
          description: The host key that the operator accepted. `null` in the first call.
      examples:
        - type: sftp
          host: nas.lan
          port: 22
          user: care
          path: /volume1/care
          host_key: ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEXAMPLEEXAMPLEEXAMPLE=
    DrDestinationS3:
      type: object
      additionalProperties: false
      description: An S3 bucket, with its keys. The restored secrets of the old device replace these keys after the job.
      required: [type, endpoint, bucket, access_key_id, secret_access_key]
      properties:
        type:
          type: string
          const: s3
          description: The destination type.
        endpoint:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/endpoint'
          description: The S3 service.
        region:
          oneOf:
            - $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/region'
            - type: 'null'
          description: The region.
        bucket:
          $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/bucket'
          description: The bucket.
        prefix:
          oneOf:
            - $ref: '../../agent/internal/config/schema/config.schema.json#/$defs/destination/properties/prefix'
            - type: 'null'
          description: The prefix inside the bucket.
        access_key_id:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: The S3 access key id.
          examples: [AKIAEXAMPLE]
        secret_access_key:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
          description: The S3 secret access key.
          examples: [wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY]
      examples:
        - type: s3
          endpoint: 'https://s3.eu-central-003.backblazeb2.com'
          region: eu-central-003
          bucket: sunrise-care
          prefix: care-pi
          access_key_id: AKIAEXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    DrInspectRequest:
      type: object
      additionalProperties: false
      description: The recovery key and the one destination of a restore of this device.
      required: [recovery_key, destination]
      properties:
        recovery_key:
          $ref: '#/components/schemas/RecoveryKeyInput'
        destination:
          $ref: '#/components/schemas/DrDestination'
      examples:
        - recovery_key:
            words: [abandon, ability, able, about, above, absent, absorb, abstract, absurd, abuse, access, accident, account, accuse, achieve, acid, acoustic, acquire, across, act, action, actor, actress, actual]
          destination: {type: posix, path: null, disk_label: care-usb1}
    DrInspection:
      type: object
      additionalProperties: false
      description: What a destination holds for a recovery key. The wizard shows it before the operator starts the restore.
      required: [key_id, location, source, snapshots, newest_db_snapshot, newest_files_snapshot, pitr, sizes, space, warnings]
      properties:
        key_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: The key id of the recovery key.
          examples: [1a2b3c4d]
        location:
          type: string
          description: The restic repository, without secrets.
          examples: [/var/lib/care-pi/disks/care-usb1/care-pi-1a2b3c4d]
        source:
          type: object
          additionalProperties: false
          description: The old device, from `config.yaml` and `lock.yaml` of the newest config snapshot.
          required: [display_name, hostname, agent_version, solution, config_time]
          properties:
            display_name:
              type: string
              description: '`identity.display_name`.'
              examples: [Sunrise Clinic]
            hostname:
              type: string
              description: '`identity.hostname`. The restored device gets this host name.'
              examples: [care]
            agent_version:
              type: [string, 'null']
              description: '`agent_version` of the lock. A newer version than this agent gives the warning `agent-older`.'
              examples: [v0.4.0]
            solution:
              type: [string, 'null']
              description: '`solution.name`.'
              examples: [care-clinic]
            config_time:
              type: string
              format: date-time
              description: The time of the config snapshot.
        snapshots:
          type: array
          description: The snapshots, newest first (50 at most).
          items:
            $ref: '#/components/schemas/SnapshotInfo'
        newest_db_snapshot:
          description: The newest `db` snapshot. The default source of the database.
          oneOf:
            - $ref: '#/components/schemas/SnapshotInfo'
            - type: 'null'
        newest_files_snapshot:
          description: The newest `files` snapshot. `null` when none exists (the job then restores no file).
          oneOf:
            - $ref: '#/components/schemas/SnapshotInfo'
            - type: 'null'
        pitr:
          type: [object, 'null']
          additionalProperties: false
          description: The restore window of the pgBackRest repository in the newest `db` snapshot. `null` when it has no backup.
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
              description: The earliest point in time.
            to:
              type: string
              format: date-time
              description: The latest point in time (`latest`).
        sizes:
          type: object
          additionalProperties: false
          description: What the job fetches and writes.
          required: [db_repository_bytes, files_bytes, database_bytes]
          properties:
            db_repository_bytes:
              type: integer
              minimum: 0
              description: The pgBackRest repository in the `db` snapshot.
            files_bytes:
              type: integer
              minimum: 0
              description: The files in the `files` snapshot.
            database_bytes:
              type: integer
              minimum: 0
              description: The database after the restore (the size of the newest backup).
        space:
          type: object
          additionalProperties: false
          description: The free space for the job.
          required: [path, required_bytes, free_bytes, ok]
          properties:
            path:
              type: string
              description: The file system of `/var/lib/care-pi`.
              examples: [/var/lib/care-pi]
            required_bytes:
              type: integer
              minimum: 0
              description: The sum of `sizes` and 1 GiB.
            free_bytes:
              type: integer
              minimum: 0
              description: The free space now.
            ok:
              type: boolean
              description: '`free_bytes` is larger than `required_bytes`.'
        warnings:
          type: array
          description: |
            Things to tell the operator. Codes: `source-may-be-active` (the newest snapshot is younger than 2 intervals: the old
            device can still run), `agent-older` (the backup comes from a newer agent), `no-files-snapshot`,
            `files-older-than-db` (the skew of `02` §6, in `message`).
          items:
            $ref: '#/components/schemas/StepIssue'
      examples:
        - key_id: 1a2b3c4d
          location: /var/lib/care-pi/disks/care-usb1/care-pi-1a2b3c4d
          source: {display_name: Sunrise Clinic, hostname: care, agent_version: v0.4.0, solution: care-clinic, config_time: '2026-10-30T10:45:00Z'}
          snapshots:
            - {destination: null, snapshot_id: 4f1e9a2c, time: '2026-10-30T10:45:00Z', contents: [db, config], size_bytes: 52428800, hostname: care, key_id: 1a2b3c4d}
          newest_db_snapshot: {destination: null, snapshot_id: 4f1e9a2c, time: '2026-10-30T10:45:00Z', contents: [db, config], size_bytes: 52428800, hostname: care, key_id: 1a2b3c4d}
          newest_files_snapshot: {destination: null, snapshot_id: 1a2b3c4d, time: '2026-10-30T02:30:00Z', contents: [files, config], size_bytes: 734003200, hostname: care, key_id: 1a2b3c4d}
          pitr: {from: '2026-10-19T01:00:00Z', to: '2026-10-30T10:44:00Z'}
          sizes: {db_repository_bytes: 52428800, files_bytes: 734003200, database_bytes: 48500000}
          space: {path: /var/lib/care-pi, required_bytes: 1908408320, free_bytes: 221000000000, ok: true}
          warnings:
            - {code: files-older-than-db, message: the newest files snapshot is 8 hours older than the database, pointer: null}
    DrRestoreRequest:
      type: object
      additionalProperties: false
      description: A restore of this device from one destination (`POST /restore/dr`).
      required: [recovery_key, destination]
      properties:
        recovery_key:
          $ref: '#/components/schemas/RecoveryKeyInput'
        destination:
          $ref: '#/components/schemas/DrDestination'
        time:
          type: [string, 'null']
          format: date-time
          description: 'The point in time of the database. `null`: the latest point of the `db` snapshot.'
        snapshot_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8,64}$'
          description: 'The `db` snapshot. `null`: the newest. An older snapshot helps when the newest copy is damaged.'
        files:
          type: boolean
          default: true
          description: Restore the files of the newest `files` snapshot too.
        pause_backups:
          type: boolean
          default: false
          description: 'Write `backups.paused: true`, so the restored device does not write to the destinations. Use it for a test on a second device.'
      examples:
        - recovery_key:
            words: [abandon, ability, able, about, above, absent, absorb, abstract, absurd, abuse, access, accident, account, accuse, achieve, acid, acoustic, acquire, across, act, action, actor, actress, actual]
          destination: {type: s3, endpoint: 'https://s3.eu-central-003.backblazeb2.com', region: eu-central-003, bucket: sunrise-care, prefix: care-pi, access_key_id: AKIAEXAMPLE, secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
          time: null
          snapshot_id: null
          files: true
          pause_backups: false
    SetupRestore:
      type: object
      additionalProperties: false
      description: The entry point of the branch "Restore from backup" of the setup wizard (`POST /restore/dr`, design note section 13.9).
      required: [available, job_id, job_state]
      properties:
        available:
          type: boolean
          description: '`POST /restore/dr` is possible now: the setup state is `claimed` or `setup`, and no job holds the apply lock.'
        job_id:
          description: The last job of kind `restore-dr`. `null` before the first one.
          oneOf:
            - $ref: '#/components/schemas/JobId'
            - type: 'null'
        job_state:
          description: The state of that job.
          oneOf:
            - $ref: '#/components/schemas/JobState'
            - type: 'null'
      examples:
        - available: true
          job_id: null
          job_state: null
    BackupRunResult:
      type: object
      additionalProperties: false
      description: The result of a `backup-run` job.
      required: [kind, scope, local, destinations]
      properties:
        kind:
          type: string
          const: backup-run
          description: The job kind.
        scope:
          type: string
          enum: [all, local-db, destination]
          description: The scope of the request.
        local:
          type: [object, 'null']
          additionalProperties: false
          description: 'The local backup. With `type: incr` it is a checkpoint. `null` for `scope: destination`.'
          required: [label, type, undo_point, timeline, repo_size_bytes]
          properties:
            label:
              $ref: '#/components/schemas/BackupLabel'
            type:
              type: string
              enum: [full, incr]
              description: The backup type.
            undo_point:
              type: string
              format: date-time
              description: The end of the backup. A restore of `label` gives the data of this time.
            timeline:
              type: integer
              minimum: 1
              description: The timeline.
            repo_size_bytes:
              type: integer
              minimum: 0
              description: The size of the backup in the repository.
        destinations:
          type: array
          description: The snapshots to each destination.
          items:
            type: object
            additionalProperties: false
            description: The snapshots to one destination.
            required: [id, db_snapshot_id, files_snapshot_id, added_bytes]
            properties:
              id:
                type: string
                pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
                description: The destination id.
              db_snapshot_id:
                type: string
                pattern: '^[0-9a-f]{8,64}$'
                description: The new `db` snapshot.
              files_snapshot_id:
                type: string
                pattern: '^[0-9a-f]{8,64}$'
                description: The new `files` snapshot.
              added_bytes:
                type: integer
                minimum: 0
                description: The bytes that the two snapshots added.
      examples:
        - kind: backup-run
          scope: local-db
          local: {label: 20261026-010002F_20261030-104705I, type: incr, undo_point: '2026-10-30T10:47:10Z', timeline: 1, repo_size_bytes: 25000}
          destinations: []
    BackupVerifyResult:
      type: object
      additionalProperties: false
      description: The result of a `backup-verify` job that found no damage.
      required: [kind, local, destinations]
      properties:
        kind:
          type: string
          const: backup-verify
          description: The job kind.
        local:
          description: '`pgbackrest verify`. `null` for `scope: destination`.'
          oneOf:
            - $ref: '#/components/schemas/VerifyOutcome'
            - type: 'null'
        destinations:
          type: array
          description: The check of each destination.
          items:
            type: object
            additionalProperties: false
            description: The check of one destination.
            required: [id, read_data_subset_pct, pruned_bytes, duration_s]
            properties:
              id:
                type: string
                pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
                description: The destination id.
              read_data_subset_pct:
                type: integer
                minimum: 1
                maximum: 100
                description: The percent of the data that the check read.
              pruned_bytes:
                type: [integer, 'null']
                minimum: 0
                description: The bytes that `restic prune` freed. `null` without `prune`.
              duration_s:
                type: number
                minimum: 0
                description: The time of the check.
      examples:
        - kind: backup-verify
          local: {job_id: 20261031T030000.000Z-backup-verify, finished_at: '2026-10-31T03:00:01Z', ok: true, detail: null}
          destinations:
            - {id: nas, read_data_subset_pct: 5, pruned_bytes: 0, duration_s: 41.2}
    RestorePitrResult:
      type: object
      additionalProperties: false
      description: The result of a `restore-pitr` job. `checkpoint` undoes the restore.
      required: [kind, restored_to, timeline, checkpoint, full_backup_label, downtime_s]
      properties:
        kind:
          type: string
          const: restore-pitr
          description: The job kind.
        restored_to:
          type: string
          format: date-time
          description: The point in time that the database has now (`time`, or the `undo_point` of the checkpoint of the request).
        timeline:
          type: integer
          minimum: 1
          description: The new timeline.
        checkpoint:
          $ref: '#/components/schemas/Checkpoint'
        full_backup_label:
          oneOf:
            - $ref: '#/components/schemas/BackupLabel'
            - type: 'null'
          description: The full backup of the new timeline. `null` when it failed (the banner `local-backup-failed` shows; the timer tries again).
        downtime_s:
          type: number
          minimum: 0
          description: The time with the maintenance page.
      examples:
        - kind: restore-pitr
          restored_to: '2026-10-30T09:40:00Z'
          timeline: 2
          checkpoint: {label: 20261026-010002F_20261030-104705I, undo_point: '2026-10-30T10:47:10Z', timeline: 1, job_id: 20261030T104700.000Z-restore-pitr, job_kind: restore-pitr, reason: undo the import of 09:42}
          full_backup_label: 20261030-104830F
          downtime_s: 71.5
    RestoreFilesResult:
      type: object
      additionalProperties: false
      description: The result of a `restore-files` job.
      required: [kind, destination, snapshot_id, snapshot_time, target, path, files, bytes, verified]
      properties:
        kind:
          type: string
          const: restore-files
          description: The job kind.
        destination:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
          description: The destination.
        snapshot_id:
          type: string
          pattern: '^[0-9a-f]{8,64}$'
          description: The snapshot.
        snapshot_time:
          type: string
          format: date-time
          description: The time of the snapshot.
        target:
          type: string
          enum: [in-place, side-dir]
          description: The target of the request.
        path:
          type: string
          description: The directory with the restored files.
          examples: [/var/lib/care-pi/restore/20261030T110000.000Z-restore-files]
        files:
          type: integer
          minimum: 0
          description: The restored files.
        bytes:
          type: integer
          minimum: 0
          description: The restored bytes.
        verified:
          type: boolean
          description: '`restic restore --verify` read each restored file back.'
      examples:
        - kind: restore-files
          destination: usb
          snapshot_id: 1a2b3c4d
          snapshot_time: '2026-10-30T02:30:00Z'
          target: side-dir
          path: /var/lib/care-pi/restore/20261030T110000.000Z-restore-files
          files: 214
          bytes: 88080384
          verified: true
    RestoreDrResult:
      type: object
      additionalProperties: false
      description: The result of a `restore-dr` job. The console shows the hand-off page with it, then the login page.
      required: [kind, key_id, location, db_snapshot_id, db_snapshot_time, restored_to, timeline, files_snapshot_id, files_snapshot_time, skew_s, display_name, hostname, care_url, console_url, urls, backups_paused, console_account]
      properties:
        kind:
          type: string
          const: restore-dr
          description: The job kind.
        key_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: The key id of the recovery key.
        location:
          type: string
          description: The restic repository of the restore.
        db_snapshot_id:
          type: string
          pattern: '^[0-9a-f]{8,64}$'
          description: The `db` snapshot.
        db_snapshot_time:
          type: string
          format: date-time
          description: The time of the `db` snapshot.
        restored_to:
          type: string
          format: date-time
          description: The point in time of the database.
        timeline:
          type: integer
          minimum: 1
          description: The new timeline.
        files_snapshot_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8,64}$'
          description: 'The `files` snapshot. `null` with `files: false` or without a `files` snapshot.'
        files_snapshot_time:
          type: [string, 'null']
          format: date-time
          description: The time of the `files` snapshot.
        skew_s:
          type: [integer, 'null']
          description: '`restored_to` minus `files_snapshot_time`, in seconds (`02` §6, S18). The console shows it.'
        display_name:
          type: string
          description: |
            `identity.display_name` of the restored config (the clinic name). The job ends each session with the
            event `done`, so the console cannot read `GET /config` after the restore; it shows this name on the hand-off page.
          examples: [Sunrise Clinic]
        hostname:
          type: string
          description: '`identity.hostname` of the restored config. The OS host name is now this name.'
          examples: [care]
        care_url:
          type: string
          format: uri
          description: Care on the primary host name.
          examples: [https://care.local/]
        console_url:
          type: string
          format: uri
          description: The console on the primary host name. Log in there with the console password of the old device.
          examples: ['https://care.local:8443/']
        urls:
          type: array
          description: Care on each host name and LAN address.
          items:
            type: string
            format: uri
        backups_paused:
          type: boolean
          description: '`backups.paused` is `true` (`pause_backups`).'
        console_account:
          type: string
          const: restored
          description: The console account of the old device is back. Each session ended.
      examples:
        - kind: restore-dr
          key_id: 1a2b3c4d
          location: s3:https://s3.eu-central-003.backblazeb2.com/sunrise-care/care-pi/care-pi-1a2b3c4d
          db_snapshot_id: 4f1e9a2c
          db_snapshot_time: '2026-10-30T10:45:00Z'
          restored_to: '2026-10-30T10:44:00Z'
          timeline: 2
          files_snapshot_id: 1a2b3c4d
          files_snapshot_time: '2026-10-30T02:30:00Z'
          skew_s: 29640
          display_name: Sunrise Clinic
          hostname: care
          care_url: https://care.local/
          console_url: 'https://care.local:8443/'
          urls: [https://care.local/, https://192.168.1.10/]
          backups_paused: false
          console_account: restored
    DiskPrepareResult:
      type: object
      additionalProperties: false
      description: 'The result of a `disk-prepare` job. Add the destination `{type: posix, disk_label: <label>}` next.'
      required: [kind, disk_id, device, label, mount_path, fs_type, size_bytes]
      properties:
        kind:
          type: string
          const: disk-prepare
          description: The job kind.
        disk_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
          description: The disk.
        device:
          type: string
          pattern: '^/dev/[a-z0-9]+$'
          description: The new partition.
          examples: [/dev/sdb1]
        label:
          type: string
          pattern: '^care-[a-z0-9][a-z0-9-]{0,10}$'
          description: The file system label. Use it as `disk_label`.
          examples: [care-usb1]
        mount_path:
          type: string
          description: The mount point.
          examples: [/var/lib/care-pi/disks/care-usb1]
        fs_type:
          type: string
          const: ext4
          description: The file system.
        size_bytes:
          type: integer
          minimum: 0
          description: The size of the file system.
      examples:
        - kind: disk-prepare
          disk_id: 'usb-SanDisk_Extreme_55AE_323130364E-0:0'
          device: /dev/sdb1
          label: care-usb1
          mount_path: /var/lib/care-pi/disks/care-usb1
          fs_type: ext4
          size_bytes: 492110393344
    RecoveryKeyRotateResult:
      type: object
      additionalProperties: false
      description: The result of a `recovery-key-rotate` job. The new key was confirmed before the job, so the active key is `confirmed`.
      required: [kind, new_key, key_id, previous_key_id, local_rekeyed, full_backup_label, destinations, removed_repositories]
      properties:
        kind:
          type: string
          const: recovery-key-rotate
          description: The job kind.
        new_key:
          type: boolean
          description: The job activated the pending key.
        key_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: The key id of the active key now.
        previous_key_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{8}$'
          description: 'The key id before the job. `null` with `new_key: false`.'
        local_rekeyed:
          type: boolean
          description: The job made a new local repository with the cipher pass of the key.
        full_backup_label:
          $ref: '#/components/schemas/BackupLabel'
        destinations:
          type: array
          description: The repository of each destination now.
          items:
            type: object
            additionalProperties: false
            description: One destination.
            required: [id, location, snapshot_id]
            properties:
              id:
                type: string
                pattern: '^[a-z0-9][a-z0-9-]{0,30}$'
                description: The destination id.
              location:
                type: string
                description: The restic repository.
              snapshot_id:
                type: string
                pattern: '^[0-9a-f]{8,64}$'
                description: The first snapshot after the rotation.
        removed_repositories:
          type: array
          description: The old repositories that the job deleted (`remove_old_repositories`).
          items:
            type: string
      examples:
        - kind: recovery-key-rotate
          new_key: false
          key_id: 1a2b3c4d
          previous_key_id: null
          local_rekeyed: true
          full_backup_label: 20261030-120102F
          destinations:
            - {id: usb, location: /var/lib/care-pi/disks/care-usb1/care-pi-1a2b3c4d, snapshot_id: 9c8b7a6d}
          removed_repositories: [/var/lib/care-pi/backup/pg.legacy]
    RestoreDrillResult:
      type: object
      additionalProperties: false
      description: The result of a `restore-drill` job. A failed drill fails the job (`verify-failed`), so `outcome` is `passed` or `skipped`.
      required: [kind, outcome, backup_label, restored_bytes, duration_s, checks, skipped_reason]
      properties:
        kind:
          type: string
          const: restore-drill
          description: The job kind.
        outcome:
          type: string
          enum: [passed, skipped]
          description: '`skipped`: a timer run found less free space than 2 times the database size.'
        backup_label:
          oneOf:
            - $ref: '#/components/schemas/BackupLabel'
            - type: 'null'
          description: The backup that the drill restored. `null` when skipped.
        restored_bytes:
          type: [integer, 'null']
          minimum: 0
          description: The size of the restored data directory.
        duration_s:
          type: number
          minimum: 0
          description: The time of the drill.
        checks:
          type: array
          description: '`pg_controldata`, the start of Postgres, `SELECT 1`.'
          items:
            $ref: '#/components/schemas/HostCheckItem'
        skipped_reason:
          type: [string, 'null']
          description: Why the drill was skipped.
      examples:
        - kind: restore-drill
          outcome: passed
          backup_label: 20261026-010002F_20261030-020003I
          restored_bytes: 48500000
          duration_s: 21.4
          checks:
            - {name: pg_controldata, level: required, ok: true, detail: 'cluster state: in production'}
            - {name: select 1, level: required, ok: true, detail: 1 row}
          skipped_reason: null
