    put:
      tags: [setup]
      operationId: setCareAdmin
      summary: Set the first Care superuser
      description: |
        Care does not run before the finish, so the finish job creates the user.
        The agent keeps the user name and the email in the setup record.
        It keeps the password only in memory, never on disk.
        After an agent restart, the step is `current` again with the error code `password-needed`.
