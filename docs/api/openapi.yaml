                    event: log
                    data: {"time":"2026-10-30T10:15:00Z","cursor":"s=8c1f;i=1a2b;b=77e0;m=11;t=62a1;x=4f","priority":6,"unit":"care-api.service","message":"Booting worker with pid: 12"}

