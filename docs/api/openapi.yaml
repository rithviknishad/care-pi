        version:
          type: string
          description: The output of `git describe` at build time.
          examples: [v0.2.0]
        commit:
          type: string
          description: The git commit of the build.
          examples: [1f2e3d4c5b6a79881f2e3d4c5b6a79881f2e3d4c]
        date:
          type: string
          description: The build date (RFC 3339), or `dev`.
