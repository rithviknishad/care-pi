  /config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Get config.yaml as JSON
      description: |
        `view=effective` (default) gives each key, with the defaults of `docs/config.md` for the keys that the file does not have.
        `view=file` gives only the keys of the file.
        The `ETag` header identifies the file content. Send it in `If-Match` with `PUT` or `PATCH`.
      x-cli: care-pi config show --json [--file]
      x-problems: [not-authenticated, invalid-config, invalid-request]
