          $ref: '#/components/schemas/StatusFlags'
        agent:
          $ref: '#/components/schemas/AgentInfo'
        setup_state:
          $ref: '#/components/schemas/SetupStateName'
        host:
          $ref: '#/components/schemas/HostStatus'
        disks:
          type: array
          description: The file systems of `/` and `/var/lib/care-pi` (one item when they are the same).
          items:
            $ref: '#/components/schemas/DiskStatus'
        clock:
          $ref: '#/components/schemas/ClockStatus'
        network:
          $ref: '#/components/schemas/NetworkSummary'
        tls:
          $ref: '#/components/schemas/TlsSummary'
        fe:
          $ref: '#/components/schemas/FeSummary'
        lock:
          description: The lock summary. `null` before the first apply.
          oneOf:
            - $ref: '#/components/schemas/LockSummary'
            - type: 'null'
        jobs:
          $ref: '#/components/schemas/JobsSummary'
        backups:
          description: The backup state, the same object as `GET /backups`. Its `health` has the banners. `null` only from an agent of Phase 2.
          oneOf:
            - $ref: '#/components/schemas/BackupsOverview'
            - type: 'null'
        updates:
          x-phase: 4
          description: The update summary (Phase 4). `null` before Phase 4.
          oneOf:
            - $ref: '#/components/schemas/UpdatesOverview'
            - type: 'null'
      examples:
        - hostnames: [care.local]
          addresses: [192.168.1.10]
          published: [192.168.1.10]
          units:
            - {unit: care.target, active_state: active, sub_state: active, health: null, memory_current_bytes: null, memory_peak_bytes: null, memory_max_bytes: null, restarts: 0, log_unit: target}
