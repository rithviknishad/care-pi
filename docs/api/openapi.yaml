      description: |
        Two forms, by the `Accept` header:

        - `text/event-stream` (SSE): the agent sends the events after `Last-Event-ID` (or `after`), then each new event,
          until the event `done`. Then it closes the stream. A `heartbeat` event comes every 15 s. It has no `id`.
          Without `Last-Event-ID` and `after`, the stream starts at the first event of the job.
        - `application/json`: one page of events after `after`, without `heartbeat` events.

        Event ids are integers. They start at 1 for each job and increase by 1.
        The agent keeps up to 20000 events for each job. Then it drops `log` events and sends one `log` event that tells how many it dropped.
        A session can have 4 open streams.
      x-cli: care-pi jobs follow JOB_ID
      x-problems: [not-authenticated, job-not-found, invalid-request]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '200':
          description: The events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventStream'
              examples:
                apply:
                  summary: The start of an apply stream
                  value: |
                    retry: 3000

                    id: 1
                    event: step
                    data: {"index":0,"name":"write-files: 2 file(s)","action":"write-files","state":"running","started_at":"2026-10-30T10:15:00Z","finished_at":null,"detail":null}

                    id: 2
                    event: step
                    data: {"index":0,"name":"write-files: 2 file(s)","action":"write-files","state":"succeeded","started_at":"2026-10-30T10:15:00Z","finished_at":"2026-10-30T10:15:01Z","detail":null}

                    event: heartbeat
                    data: {"time":"2026-10-30T10:15:15Z"}

            application/json:
              schema:
                $ref: '#/components/schemas/JobEventPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a job
      description: |
        Only a job with `cancellable: true` stops. In Phase 2 these kinds are cancellable: `fe-build`, `support-bundle`.
        The FE build restores care-api and care-worker before it stops.
        The agent returns `202` at once. The job then gets the state `cancelled`.
      security:
        - session: []
          csrf: []
      x-cli: care-pi jobs cancel JOB_ID
      x-problems: [not-authenticated, csrf, job-not-found, job-not-cancellable]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedProblem'
        '202':
          $ref: '#/components/responses/JobAccepted'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
