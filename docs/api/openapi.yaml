    StatusFlags:
      type: object
      additionalProperties: false
      description: Named conditions for the banners of the dashboard. Append-only. `true` means that the condition is present.
      required: [degraded, address_changed, clock_wait, maintenance, fe_missing, fe_scale_down_left, low_disk, low_memory, mdns_collision, hostname_mismatch, last_job_failed, recovery_codes_low, host_check_failed]
      properties:
        degraded:
          type: boolean
          description: The same value as `Status.degraded`.
        address_changed:
          type: boolean
          description: '`addresses` differs from `published`. Run an apply.'
        clock_wait:
          type: boolean
          description: The clock gate did not pass. Care does not start.
        maintenance:
          type: boolean
          description: Caddy serves the maintenance page.
        fe_missing:
          type: boolean
          description: '`fe.provider` is not `none`, and `fe/current` is not the build of the lock.'
        fe_scale_down_left:
          type: boolean
          description: The scale-down drop-in of an FE build exists and no FE build runs. Run an apply.
        low_disk:
          type: boolean
          description: The file system of `/var/lib/care-pi` has less than 2 GiB or less than 10 % free.
        low_memory:
          type: boolean
          description: '`MemAvailable` is less than 256 MiB.'
        mdns_collision:
          type: boolean
          description: avahi announces another name than `<hostname>.local`.
        hostname_mismatch:
          type: boolean
          description: '`identity.hostname` differs from the OS host name.'
        last_job_failed:
          type: boolean
          description: The last job of kind `apply`, `setup`, or `fe-build` failed.
        recovery_codes_low:
          type: boolean
          description: 2 or fewer recovery codes remain.
        host_check_failed:
          type: boolean
          description: A required host check fails now.
      examples:
        - degraded: true
          address_changed: false
          clock_wait: false
          maintenance: false
          fe_missing: false
          fe_scale_down_left: false
          low_disk: false
          low_memory: false
          mdns_collision: true
          hostname_mismatch: false
          last_job_failed: false
          recovery_codes_low: false
          host_check_failed: false
    UnitStatus:
      type: object
      additionalProperties: false
      description: The state of one unit. The members of Phase 1 keep their names; `log_unit` is new.
      required: [unit, active_state, sub_state, health, memory_current_bytes, memory_peak_bytes, memory_max_bytes, restarts, log_unit]
      properties:
        unit:
          type: string
          pattern: '^care[a-z0-9-]*\.(target|service|timer)$'
          description: The systemd unit.
          examples: [care-api.service]
        active_state:
          type: string
          description: systemd `ActiveState` (`active`, `inactive`, `activating`, `failed`, ...). Empty when systemd does not know the unit.
          examples: [active]
        sub_state:
          type: string
          description: systemd `SubState`.
          examples: [running]
        health:
          type: [string, 'null']
          enum: [healthy, unhealthy, starting, null]
          description: The podman health of the container. `null` for a unit without a health check.
        memory_current_bytes:
          type: [integer, 'null']
          minimum: 0
          description: systemd `MemoryCurrent`. `null` when not known.
        memory_peak_bytes:
          type: [integer, 'null']
          minimum: 0
          description: systemd `MemoryPeak`. `null` when not known.
        memory_max_bytes:
          type: [integer, 'null']
          minimum: 0
          description: systemd `MemoryMax`. `null` when there is no cap.
        restarts:
          type: integer
          minimum: 0
          description: systemd `NRestarts`.
        log_unit:
          oneOf:
            - $ref: '#/components/schemas/LogUnit'
            - type: 'null'
          description: The short name for `GET /logs/{unit}`.
      examples:
        - unit: care-api.service
          active_state: active
          sub_state: running
          health: healthy
          memory_current_bytes: 314572800
          memory_peak_bytes: 400556032
          memory_max_bytes: 536870912
          restarts: 0
          log_unit: api
    LockedImage:
      type: object
      additionalProperties: false
      description: One image of the lock.
      required: [name, ref, pull]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]+$'
          description: The image key (`care`, `postgres`, `caddy`, `redis`, `s3`, `node`).
          examples: [redis]
        ref:
          type: string
          description: The reference that the config asks for.
          examples: ['docker.io/library/redis:8-alpine']
        pull:
          type: string
          description: The reference that the units use (`<repo>@<digest>`, or the tag of a local image).
          examples: ['docker.io/library/redis@sha256:21090af93f83c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9']
      examples:
        - name: redis
          ref: 'docker.io/library/redis:8-alpine'
          pull: 'docker.io/library/redis@sha256:21090af93f83c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9'
    AgentInfo:
      type: object
      additionalProperties: false
      description: The agent binary (`care-pi version`).
      required: [version, commit, date, dev_build, started_at]
