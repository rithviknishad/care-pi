            maximum: 5000
            default: 100
        - name: since
          in: query
          description: Only lines at or after this time.
          schema:
            type: string
            format: date-time
        - name: after
          in: query
          description: Only lines after this journal cursor (`next_cursor` of the previous page).
          schema:
            $ref: '#/components/schemas/JournalCursor'
        - name: follow
          in: query
          description: Keep the stream open and send new lines. Only with the `Accept` header `text/event-stream`.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LastEventIdCursor'
